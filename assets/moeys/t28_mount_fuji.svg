<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="100%" height="100%">
  <rect width="740" height="440" fill="#f8fafc" rx="12"/>
  
  <!-- Header -->
  <rect x="30" y="20" width="680" height="42" rx="8" fill="#0d2b45"/>
  <text x="370" y="47" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ផ្លូវឡើងភ្នំហ្វូជី (Gotemba Trail — Mount Fuji)</text>
  
  <!-- Left Side: Mountain Silhouette & Trail -->
  <rect x="30" y="80" width="380" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Sky gradient -->
  <rect x="40" y="90" width="360" height="200" rx="6" fill="#e0f2fe"/>
  <!-- Mt Fuji Peak -->
  <polygon points="220,110 330,270 110,270" fill="#3b82f6"/>
  <!-- Snowcap -->
  <polygon points="220,110 250,155 235,150 220,160 205,150 190,155" fill="#ffffff"/>
  
  <!-- Trail zigzag -->
  <path d="M 120 270 L 160 230 L 140 200 L 190 170 L 180 140 L 220 120" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="5 3"/>
  <circle cx="120" cy="270" r="5" fill="#16a34a"/>
  <text x="125" y="288" fill="#16a34a" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5" font-weight="700">ចំណុចចេញដំណើរ</text>
  <circle cx="220" cy="120" r="5" fill="#dc2626"/>
  <text x="220" y="105" fill="#dc2626" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">កំពូលភ្នំ (9 km)</text>

  <!-- Metric summary below mountain -->
  <rect x="45" y="300" width="350" height="95" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="55" y="322" fill="#334155" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• រដូវបើក ៖ <b>1 កក្កដា ដល់ 27 សីហា (58 ថ្ងៃ)</b></text>
  <text x="55" y="344" fill="#334155" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• អ្នកឡើងសរុប ៖ <b>200 000 នាក់</b> (~3400 នាក់/ថ្ងៃ)</text>
  <text x="55" y="366" fill="#0284c7" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• ចម្ងាយឡើង 9 km, ចម្ងាយចុះ 9 km (សរុប 18 km)</text>
  <text x="55" y="386" fill="#0284c7" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• ជំហានរាប់បាន 22 500 ជំហាន → ជំហានមធ្យម 40 cm</text>

  <!-- Right Side: Schedule & Speed Breakdown -->
  <rect x="430" y="80" width="280" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="570" y="112" fill="#0d2b45" font-family="'Noto Sans Khmer', sans-serif" font-size="14" font-weight="700" text-anchor="middle">កាលវិភាគដើររបស់ តូរ៉ា</text>
  
  <!-- Ascent Card -->
  <rect x="445" y="130" width="250" height="75" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="460" y="152" fill="#1e40af" font-family="'Noto Sans Khmer', sans-serif" font-size="12.5" font-weight="700">ពេលដើរឡើងភ្នំ (Ascent) ៖</text>
  <text x="460" y="174" fill="#1e3a8a" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• ល្បឿនមធ្យម ៖ <b>1.5 km/h</b></text>
  <text x="460" y="194" fill="#1e3a8a" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• រយៈពេល ៖ 9 km ÷ 1.5 = <b>6 ម៉ោង</b></text>

  <!-- Descent Card -->
  <rect x="445" y="215" width="250" height="75" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="460" y="237" fill="#166534" font-family="'Noto Sans Khmer', sans-serif" font-size="12.5" font-weight="700">ពេលដើរចុះភ្នំ (Descent) ៖</text>
  <text x="460" y="259" fill="#14532d" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• ល្បឿន (2 ដង) ៖ <b>3.0 km/h</b></text>
  <text x="460" y="279" fill="#14532d" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• រយៈពេល ៖ 9 km ÷ 3.0 = <b>3 ម៉ោង</b></text>

  <!-- Target Return -->
  <rect x="445" y="300" width="250" height="95" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="460" y="322" fill="#991b1b" font-family="'Noto Sans Khmer', sans-serif" font-size="12.5" font-weight="700">គោលដៅត្រឡប់មកវិញ ៖</text>
  <text x="460" y="344" fill="#7f1d1d" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• ម៉ោងមកដល់ចុងក្រោយ ៖ <b>8:00 pm (20:00)</b></text>
  <text x="460" y="364" fill="#7f1d1d" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• រយៈពេលសរុប ៖ 6 + 3 = <b>9 ម៉ោង</b></text>
  <text x="460" y="384" fill="#991b1b" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700">→ ម៉ោងចេញដំណើរ ៖ 11:00 am</text>
</svg>
