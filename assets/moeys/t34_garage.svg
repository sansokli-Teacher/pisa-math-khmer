<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="100%" height="100%">
  <rect width="740" height="440" fill="#f8fafc" rx="12"/>
  
  <rect x="30" y="20" width="680" height="42" rx="8" fill="#0d2b45"/>
  <text x="370" y="47" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ប្លង់វិមាត្រយានដ្ឋាន និងដំបូលពីរជ្រាល (Garage Blueprint)</text>
  
  <!-- Left: Front Elevation -->
  <rect x="30" y="80" width="335" height="335" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="197" y="112" fill="#0d2b45" font-family="'Noto Sans Khmer', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ទិដ្ឋភាពខាងមុខ (Front Elevation)</text>
  
  <!-- Base wall: width 5.0m, height 2.4m -->
  <rect x="80" y="220" width="235" height="115" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <!-- Garage Door -->
  <rect x="115" y="245" width="85" height="90" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <!-- Window -->
  <rect x="235" y="245" width="50" height="40" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5"/>
  
  <!-- Gable Roof Triangle: peak height 3.4m (1.0m above eaves) -->
  <polygon points="80,220 197,172 315,220" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
  <line x1="197" y1="172" x2="197" y2="220" stroke="#ea580c" stroke-dasharray="4 3" stroke-width="1.5"/>
  
  <!-- Dimensions on Front -->
  <!-- Width: 5.00m -->
  <line x1="80" y1="355" x2="315" y2="355" stroke="#0284c7" stroke-width="1.5"/>
  <text x="197" y="374" fill="#0284c7" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700" text-anchor="middle">ទទឹង 5.00 m</text>
  
  <!-- Wall Height: 2.40m -->
  <line x1="55" y1="220" x2="55" y2="335" stroke="#0284c7" stroke-width="1.5"/>
  <text x="48" y="282" fill="#0284c7" font-family="'Noto Sans Khmer', sans-serif" font-size="11" font-weight="700" text-anchor="end">2.40 m</text>
  
  <!-- Total Height: 3.40m -->
  <line x1="335" y1="172" x2="335" y2="335" stroke="#ea580c" stroke-width="1.5"/>
  <text x="343" y="258" fill="#ea580c" font-family="'Noto Sans Khmer', sans-serif" font-size="11" font-weight="700">3.40 m</text>
  
  <!-- Roof Rise: 1.00m -->
  <text x="212" y="200" fill="#c2410c" font-family="'Noto Sans Khmer', sans-serif" font-size="11" font-weight="700">1.00 m</text>

  <!-- Right: Side Elevation / 3D Layout -->
  <rect x="380" y="80" width="330" height="335" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="545" y="112" fill="#0d2b45" font-family="'Noto Sans Khmer', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ទិដ្ឋភាពចំហៀង (Side Elevation)</text>
  
  <!-- Side Wall: Length 6.00m, Height 2.40m -->
  <rect x="430" y="220" width="230" height="115" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <!-- Roof Slope rectangle side view -->
  <polygon points="430,220 430,172 660,172 660,220" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  
  <!-- Dimensions on Side -->
  <!-- Length: 6.00m -->
  <line x1="430" y1="355" x2="660" y2="355" stroke="#0284c7" stroke-width="1.5"/>
  <text x="545" y="374" fill="#0284c7" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700" text-anchor="middle">បណ្តោយ 6.00 m</text>
  
  <!-- Eaves to ridge indication -->
  <line x1="410" y1="172" x2="410" y2="220" stroke="#ea580c" stroke-width="1.5"/>
  <text x="402" y="200" fill="#ea580c" font-family="'Noto Sans Khmer', sans-serif" font-size="11" font-weight="700" text-anchor="end">1.00 m</text>

  <rect x="405" y="260" width="280" height="70" rx="6" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="545" y="285" fill="#0f172a" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700" text-anchor="middle">លក្ខណៈដំបូល ៖</text>
  <text x="545" y="310" fill="#334155" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5" text-anchor="middle">ដំបូលមាន ២ ផ្ទាំងរាងចតុកោណកែងស្មើគ្នា</text>
</svg>