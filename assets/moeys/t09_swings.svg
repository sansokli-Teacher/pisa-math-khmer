<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect x="5" y="5" width="670" height="430" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">ក្រាបកម្ពស់ជើងផុតពីដី ធៀបនឹងរយៈពេល ពេលជិះលំយោល</text>
  <text x="340" y="48" text-anchor="middle" font-size="11.5" fill="#64748b">លុនា ចាប់ផ្តើមយោលទោង និងព្យាយាមយោលឱ្យបានខ្ពស់បំផុតតាមដែលអាចធ្វើបាន</text>

  <!-- 4 Graphs Grid (2x2) -->

  <!-- Graph A (Top Left - Correct) -->
  <g transform="translate(25, 62)" filter="url(#sh)">
    <rect width="300" height="165" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="10" y="10" width="28" height="22" rx="4" fill="#0284c7"/>
    <text x="24" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ក</text>
    
    <!-- Axes -->
    <line x1="55" y1="30" x2="55" y2="135" stroke="#334155" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="55" y1="135" x2="280" y2="135" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="25" text-anchor="end" font-size="9.5" fill="#475569">កម្ពស់ជើង</text>
    <text x="280" y="148" text-anchor="end" font-size="9.5" fill="#475569">រយៈពេល</text>

    <!-- Curve: oscillating with increasing amplitude -->
    <path d="M 55,135 Q 75,95 95,135 Q 120,70 145,135 Q 175,45 205,135 Q 235,20 265,135" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Graph B (Top Right) -->
  <g transform="translate(355, 62)" filter="url(#sh)">
    <rect width="300" height="165" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="10" y="10" width="28" height="22" rx="4" fill="#0284c7"/>
    <text x="24" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ខ</text>
    
    <!-- Axes -->
    <line x1="55" y1="30" x2="55" y2="135" stroke="#334155" stroke-width="1.5"/>
    <line x1="55" y1="135" x2="280" y2="135" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="25" text-anchor="end" font-size="9.5" fill="#475569">កម្ពស់ជើង</text>
    <text x="280" y="148" text-anchor="end" font-size="9.5" fill="#475569">រយៈពេល</text>

    <!-- Curve: constant amplitude wave -->
    <path d="M 55,135 Q 75,55 95,135 Q 115,55 135,135 Q 155,55 175,135 Q 195,55 215,135 Q 235,55 255,135" fill="none" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Graph C (Bottom Left) -->
  <g transform="translate(25, 245)" filter="url(#sh)">
    <rect width="300" height="165" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="10" y="10" width="28" height="22" rx="4" fill="#0284c7"/>
    <text x="24" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">គ</text>
    
    <!-- Axes -->
    <line x1="55" y1="30" x2="55" y2="135" stroke="#334155" stroke-width="1.5"/>
    <line x1="55" y1="135" x2="280" y2="135" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="25" text-anchor="end" font-size="9.5" fill="#475569">កម្ពស់ជើង</text>
    <text x="280" y="148" text-anchor="end" font-size="9.5" fill="#475569">រយៈពេល</text>

    <!-- Curve: nested arcs -->
    <path d="M 70,70 Q 165,135 260,70 M 70,85 Q 165,142 260,85 M 70,100 Q 165,148 260,100" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Graph D (Bottom Right) -->
  <g transform="translate(355, 245)" filter="url(#sh)">
    <rect width="300" height="165" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="10" y="10" width="28" height="22" rx="4" fill="#0284c7"/>
    <text x="24" y="26" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ឃ</text>
    
    <!-- Axes -->
    <line x1="55" y1="30" x2="55" y2="135" stroke="#334155" stroke-width="1.5"/>
    <line x1="55" y1="135" x2="280" y2="135" stroke="#334155" stroke-width="1.5"/>
    <text x="50" y="25" text-anchor="end" font-size="9.5" fill="#475569">កម្ពស់ជើង</text>
    <text x="280" y="148" text-anchor="end" font-size="9.5" fill="#475569">រយៈពេល</text>

    <!-- Curve: straight line upward -->
    <line x1="55" y1="135" x2="265" y2="50" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>