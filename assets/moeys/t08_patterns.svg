<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect x="5" y="5" width="670" height="420" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="32" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">លំនាំគំរូរាងជណ្តើរដោយប្រើការ៉េ (Staircase Pattern)</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#64748b">ស៊ូ បានសង់លំនាំគំរូរាងជណ្តើរដោយប្រើការ៉េតាមដំណាក់កាលបន្តបន្ទាប់</text>

  <!-- 4 Stages Grid -->
  <g transform="translate(25, 75)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)" filter="url(#sh)">
      <rect width="145" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="72" y="25" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">ដំណាក់កាលទី ១</text>
      <!-- 1 square at bottom: size 26x26. Bottom baseline Y=190 -->
      <rect x="59" y="164" width="26" height="26" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
      <rect x="25" y="205" width="95" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="72" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">1 ការ៉េ</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(160, 0)" filter="url(#sh)">
      <rect width="145" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="72" y="25" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">ដំណាក់កាលទី ២</text>
      <!-- col 1 (height 2): X=46, Y=138, 164. col 2 (height 1): X=72, Y=164 -->
      <rect x="46" y="138" width="26" height="26" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
      <rect x="46" y="164" width="26" height="26" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
      <rect x="72" y="164" width="26" height="26" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
      <rect x="25" y="205" width="95" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="72" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">3 ការ៉េ</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(320, 0)" filter="url(#sh)">
      <rect width="145" height="240" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="72" y="25" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">ដំណាក់កាលទី ៣</text>
      <!-- col 1 (3): X=33, Y=112, 138, 164. col 2 (2): X=59, Y=138, 164. col 3 (1): X=85, Y=164 -->
      <rect x="33" y="112" width="26" height="26" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
      <rect x="33" y="138" width="26" height="26" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
      <rect x="33" y="164" width="26" height="26" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>

      <rect x="59" y="138" width="26" height="26" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
      <rect x="59" y="164" width="26" height="26" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>

      <rect x="85" y="164" width="26" height="26" rx="3" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>

      <rect x="25" y="205" width="95" height="22" rx="11" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="72" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1d4ed8">6 ការ៉េ</text>
    </g>

    <!-- Stage 4 (Target) -->
    <g transform="translate(480, 0)" filter="url(#sh)">
      <rect width="145" height="240" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
      <text x="72" y="25" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#065f46">ដំណាក់កាលទី ៤</text>
      <!-- Outline dashed squares for stage 4 -->
      <g stroke="#10b981" stroke-dasharray="3,3" stroke-width="1.2" fill="#ecfdf5">
        <rect x="20" y="86" width="26" height="26" rx="3"/>
        <rect x="20" y="112" width="26" height="26" rx="3"/>
        <rect x="20" y="138" width="26" height="26" rx="3"/>
        <rect x="20" y="164" width="26" height="26" rx="3"/>

        <rect x="46" y="112" width="26" height="26" rx="3"/>
        <rect x="46" y="138" width="26" height="26" rx="3"/>
        <rect x="46" y="164" width="26" height="26" rx="3"/>

        <rect x="72" y="138" width="26" height="26" rx="3"/>
        <rect x="72" y="164" width="26" height="26" rx="3"/>

        <rect x="98" y="164" width="26" height="26" rx="3"/>
      </g>
      <text x="72" y="145" text-anchor="middle" font-size="24" font-weight="bold" fill="#059669">?</text>
      <rect x="20" y="205" width="105" height="22" rx="11" fill="#d1fae5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="72" y="220" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#065f46">? ការ៉េ</text>
    </g>
  </g>

  <!-- Formula hint box -->
  <g transform="translate(25, 335)" filter="url(#sh)">
    <rect width="630" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="20" y="28" font-size="12" font-weight="bold" fill="#0f172a">លំនាំនៃការបន្ថែមការ៉េ ៖</text>
    <text x="20" y="52" font-size="12" fill="#334155">ដំណាក់កាលទី 1 ៖ 1 ការ៉េ   |   ដំណាក់កាលទី 2 ៖ 3 ការ៉េ   |   ដំណាក់កាលទី 3 ៖ 6 ការ៉េ   |   ដំណាក់កាលទី 4 ៖ ? ការ៉េ</text>
  </g>
</svg>