<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect x="5" y="5" width="670" height="420" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="32" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">ការបង់ប្រាក់ទិញអាគារតាមទំហំផ្ទៃក្រឡា (Zedland)</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#64748b">គោលការណ៍ ៖ ការចំណាយសមាមាត្រនឹងទំហំផ្ទៃក្រឡាផ្ទះល្វែងនីមួយៗ</text>

  <!-- Total Building Overview -->
  <g transform="translate(30, 70)" filter="url(#sh)">
    <rect width="620" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="620" height="28" rx="8" fill="#e0e7ff"/>
    <rect y="20" width="620" height="8" fill="#e0e7ff"/>
    <text x="16" y="19" font-size="13" font-weight="bold" fill="#3730a3">តម្លៃលក់អាគារទាំងមូល ៖ 300 000 zeds</text>
    <text x="20" y="48" font-size="12" fill="#334155">មនុស្សដែលរស់នៅក្នុងអាគារបានសម្រេចចិត្តរួមគ្នាទិញអាគារនេះ។ ម្នាក់ៗត្រូវបង់ប្រាក់តាមសមាមាត្រផ្ទៃក្រឡាផ្ទះរបស់ខ្លួន។</text>
    <text x="20" y="68" font-size="11.5" fill="#64748b">ឧទាហរណ៍ ៖ បើកាន់កាប់ 1/5 នៃផ្ទៃក្រឡាសរុប នោះត្រូវបង់ 1/5 នៃតម្លៃសរុប 300 000 zeds។</text>
  </g>

  <!-- 3 Flats Breakdown (Question 2 info) -->
  <g transform="translate(30, 165)" filter="url(#sh)">
    <!-- Flat 1 -->
    <g transform="translate(0, 0)">
      <rect width="195" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="195" height="32" rx="8" fill="#e0f2fe"/>
      <rect y="22" width="195" height="10" fill="#e0f2fe"/>
      <text x="12" y="21" font-size="13" font-weight="bold" fill="#0369a1">ផ្ទះល្វែងទី ១</text>
      <text x="12" y="58" font-size="12" fill="#475569">ទំហំផ្ទៃក្រឡា ៖</text>
      <text x="12" y="84" font-size="18" font-weight="bold" fill="#0284c7">95 m²</text>
      <text x="12" y="110" font-size="11" fill="#64748b">ផ្ទះល្វែងធំជាងគេ</text>
    </g>

    <!-- Flat 2 (Question Target) -->
    <g transform="translate(212, 0)">
      <rect width="195" height="145" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.8"/>
      <rect width="195" height="32" rx="8" fill="#d1fae5"/>
      <rect y="22" width="195" height="10" fill="#d1fae5"/>
      <text x="12" y="21" font-size="13" font-weight="bold" fill="#065f46">ផ្ទះល្វែងទី ២</text>
      <text x="12" y="58" font-size="12" fill="#475569">ទំហំផ្ទៃក្រឡា ៖</text>
      <text x="12" y="84" font-size="18" font-weight="bold" fill="#059669">85 m²</text>
      <text x="12" y="110" font-size="11" font-weight="bold" fill="#047857">? zeds (សំណួរទី ២)</text>
    </g>

    <!-- Flat 3 -->
    <g transform="translate(425, 0)">
      <rect width="195" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="195" height="32" rx="8" fill="#fef3c7"/>
      <rect y="22" width="195" height="10" fill="#fef3c7"/>
      <text x="12" y="21" font-size="13" font-weight="bold" fill="#92400e">ផ្ទះល្វែងទី ៣</text>
      <text x="12" y="58" font-size="12" fill="#475569">ទំហំផ្ទៃក្រឡា ៖</text>
      <text x="12" y="84" font-size="18" font-weight="bold" fill="#d97706">70 m²</text>
      <text x="12" y="110" font-size="11" fill="#64748b">ផ្ទះល្វែងតូចជាងគេ</text>
    </g>
  </g>

  <!-- Area Proportion Bar -->
  <g transform="translate(30, 330)" filter="url(#sh)">
    <rect width="620" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="16" y="24" font-size="12" font-weight="bold" fill="#334155">ផ្ទៃក្រឡានៃផ្ទះល្វែងទាំងបី នៅក្នុងអាគារ ៖</text>
    
    <!-- Proportional visual segments -->
    <g transform="translate(16, 35)">
      <rect width="235.6" height="22" rx="4" fill="#0284c7"/>
      <text x="117" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ផ្ទះទី ១ (95 m²)</text>
      
      <rect x="238" width="210.8" height="22" rx="4" fill="#059669"/>
      <text x="343" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ផ្ទះទី ២ (85 m²)</text>
      
      <rect x="451" width="137" height="22" rx="4" fill="#d97706"/>
      <text x="519" y="15" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ផ្ទះទី ៣ (70 m²)</text>
    </g>
  </g>
</svg>