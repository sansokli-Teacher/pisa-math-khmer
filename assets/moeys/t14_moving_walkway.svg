<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
  </defs>
  <rect x="5" y="5" width="670" height="420" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="32" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">ក្រាបចម្ងាយចរ ធៀបនឹងរយៈពេល លើផ្លូវថ្មើរជើងស្វ័យប្រវត្តិ</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#64748b">ការប្រៀបធៀបការដើរលើផ្លូវរំកិលស្វ័យប្រវត្តិ និងការដើរលើផ្លូវធម្មតា</text>

  <!-- Graph Container -->
  <g transform="translate(50, 75)" filter="url(#sh)">
    <rect width="580" height="245" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Axes -->
    <line x1="65" y1="30" x2="65" y2="200" stroke="#0f172a" stroke-width="2"/>
    <line x1="65" y1="200" x2="540" y2="200" stroke="#0f172a" stroke-width="2"/>
    <text x="55" y="25" text-anchor="end" font-size="11" font-weight="bold" fill="#334155">ចម្ងាយចរ</text>
    <text x="540" y="218" text-anchor="end" font-size="11" font-weight="bold" fill="#334155">រយៈពេល</text>

    <!-- Line 1: Walking on moving walkway (steepest) -->
    <line x1="65" y1="200" x2="320" y2="40" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="320" cy="40" r="4" fill="#2563eb"/>
    <text x="330" y="45" font-size="11.5" font-weight="bold" fill="#1d4ed8">ដើរលើផ្លូវស្វ័យប្រវត្តិ (ល្បឿនដើរ + ល្បឿនផ្លូវ)</text>

    <!-- Line 2: Walking on normal path -->
    <line x1="65" y1="200" x2="440" y2="60" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="440" cy="60" r="4" fill="#059669"/>
    <text x="450" y="65" font-size="11.5" font-weight="bold" fill="#047857">ដើរលើផ្លូវធម្មតា (ល្បឿនដើរ)</text>

    <!-- Target line position: Standing on moving walkway (slope = walkway speed) -->
    <line x1="65" y1="200" x2="500" y2="130" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,4" stroke-linecap="round"/>
    <text x="505" y="135" font-size="11.5" font-weight="bold" fill="#c2410c">? ឈរស្ងៀមលើផ្លូវស្វ័យប្រវត្តិ</text>
  </g>

  <!-- Bottom prompt note -->
  <g transform="translate(50, 335)" filter="url(#sh)">
    <rect width="580" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="16" y="26" font-size="12" font-weight="bold" fill="#0f172a">សំណួរ ៖</text>
    <text x="16" y="48" font-size="11.5" fill="#334155">តើបន្ទាត់តំណាងឱ្យ «មនុស្សម្នាក់ទៀតដែលឈរស្ងៀមលើផ្លូវថ្មើរជើងស្វ័យប្រវត្តិ» ត្រូវស្ថិតនៅត្រង់ណាធៀបនឹងបន្ទាត់ទាំងពីរខាងលើ?</text>
  </g>
</svg>