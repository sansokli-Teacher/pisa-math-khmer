<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <rect x="5" y="5" width="670" height="420" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="32" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">លក្ខខណ្ឌនៃការរចនាសំណុំកាក់ប្រាក់ថ្មី</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#64748b">កាក់ទាំងអស់មានរាងជារង្វង់ ពណ៌ប្រាក់ ប៉ុន្តែមានអង្កត់ផ្ចិតខុសៗគ្នា</text>

  <!-- Rules Card -->
  <g transform="translate(30, 70)" filter="url(#sh)">
    <rect width="620" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="620" height="30" rx="8" fill="#e0e7ff"/>
    <rect y="22" width="620" height="8" fill="#e0e7ff"/>
    <text x="16" y="20" font-size="13" font-weight="bold" fill="#3730a3">លក្ខខណ្ឌបច្ចេកទេសចំនួន ៣ ៖</text>
    
    <text x="20" y="52" font-size="12" fill="#334155">១. អង្កត់ផ្ចិតនៃកាក់ មិនត្រូវតូចជាង <tspan font-weight="bold" fill="#0284c7">15 mm</tspan> និងមិនត្រូវធំជាង <tspan font-weight="bold" fill="#0284c7">45 mm</tspan> ឡើយ។</text>
    <text x="20" y="78" font-size="12" fill="#334155">២. អង្កត់ផ្ចិតនៃកាក់បន្ទាប់ ត្រូវតែធំជាងអង្កត់ផ្ចិតនៃកាក់មុនយ៉ាងតិច <tspan font-weight="bold" fill="#b91c1c">30%</tspan> (គុណនឹង 1.3 ឬលើស)។</text>
    <text x="20" y="104" font-size="12" fill="#334155">៣. ម៉ាស៊ីនផលិតកាក់បានតែអង្កត់ផ្ចិតជា <tspan font-weight="bold" fill="#059669">ចំនួនគត់នៃមីលីម៉ែត្រ (Whole mm)</tspan> ប៉ុណ្ណោះ (ឧ. 17 mm បាន តែ 17.3 mm មិនបានទេ)។</text>
  </g>

  <!-- Goal Card -->
  <g transform="translate(30, 220)" filter="url(#sh)">
    <rect width="620" height="185" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <rect width="620" height="30" rx="8" fill="#d1fae5"/>
    <rect y="22" width="620" height="8" fill="#d1fae5"/>
    <text x="16" y="20" font-size="13" font-weight="bold" fill="#065f46">គោលដៅរចនា ៖ រកសំណុំកាក់ដែលមានចំនួនកាក់ច្រើនបំផុត</text>

    <!-- Visual coins preview -->
    <g transform="translate(20, 45)">
      <!-- Coin 1: 15mm -->
      <g transform="translate(25, 45)">
        <circle r="18" fill="url(#coinGrad)" stroke="#64748b" stroke-width="1.5"/>
        <text y="4" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e293b">15</text>
        <text y="34" text-anchor="middle" font-size="10" fill="#475569">កាក់ ១</text>
      </g>
      <!-- Arrow 1 -->
      <text x="75" y="48" font-size="12" fill="#94a3b8">➔</text>
      <!-- Coin 2 -->
      <g transform="translate(125, 45)">
        <circle r="24" fill="url(#coinGrad)" stroke="#64748b" stroke-width="1.5"/>
        <text y="4" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">?</text>
        <text y="39" text-anchor="middle" font-size="10" fill="#475569">កាក់ ២</text>
      </g>
      <!-- Arrow 2 -->
      <text x="175" y="48" font-size="12" fill="#94a3b8">➔</text>
      <!-- Coin 3 -->
      <g transform="translate(235, 45)">
        <circle r="31" fill="url(#coinGrad)" stroke="#64748b" stroke-width="1.5"/>
        <text y="4" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">?</text>
        <text y="46" text-anchor="middle" font-size="10" fill="#475569">កាក់ ៣</text>
      </g>
      <!-- Arrow 3 -->
      <text x="295" y="48" font-size="12" fill="#94a3b8">➔</text>
      <!-- Coin 4 -->
      <g transform="translate(365, 45)">
        <circle r="40" fill="url(#coinGrad)" stroke="#64748b" stroke-width="1.5"/>
        <text y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">?</text>
        <text y="54" text-anchor="middle" font-size="10" fill="#475569">កាក់ ៤</text>
      </g>
      <!-- Arrow 4 -->
      <text x="435" y="48" font-size="12" fill="#94a3b8">➔</text>
      <!-- Coin 5 -->
      <g transform="translate(515, 45)">
        <circle r="50" fill="url(#coinGrad)" stroke="#64748b" stroke-width="1.5"/>
        <text y="6" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e293b">?</text>
        <text y="65" text-anchor="middle" font-size="10" fill="#475569">កាក់ ៥ (≤45)</text>
      </g>
    </g>
    <text x="20" y="168" font-size="11.5" fill="#047857">សំណុំកាក់ត្រូវចាប់ផ្តើមពីកាក់អង្កត់ផ្ចិត 15 mm និងមានចំនួនកាក់ច្រើនបំផុតតាមដែលអាចធ្វើទៅបាន។</text>
  </g>
</svg>