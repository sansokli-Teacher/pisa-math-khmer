<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect x="5" y="5" width="670" height="430" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">តារាងកំណត់ទំហំស្បែកជើងកុមារនៅប្រទេស Zedland</text>
  <text x="340" y="46" text-anchor="middle" font-size="11.5" fill="#64748b">ប្រវែងបាតជើងគិតជាមីលីម៉ែត្រ (mm) ធៀបនឹងលេខទំហំស្បែកជើង</text>

  <!-- Table 2 columns (Left column sizes 18-26, Right column sizes 27-35) -->
  <g transform="translate(25, 58)" filter="url(#sh)">
    <rect width="305" height="295" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Table Header -->
    <rect width="305" height="32" rx="8" fill="#e0e7ff"/>
    <rect y="24" width="305" height="8" fill="#e0e7ff"/>
    <text x="20" y="21" font-size="11" font-weight="bold" fill="#3730a3">ចាប់ពី (mm)</text>
    <text x="110" y="21" font-size="11" font-weight="bold" fill="#3730a3">ទៅដល់ (mm)</text>
    <text x="215" y="21" font-size="11" font-weight="bold" fill="#3730a3">ទំហំស្បែកជើង</text>

    <!-- Rows 18 to 26 -->
    <g font-size="11" fill="#334155">
      <text x="35" y="54">107</text><text x="130" y="54">115</text><text x="245" y="54" font-weight="bold">18</text>
      <text x="35" y="80">116</text><text x="130" y="80">122</text><text x="245" y="80" font-weight="bold">19</text>
      <text x="35" y="106">123</text><text x="130" y="106">128</text><text x="245" y="106" font-weight="bold">20</text>
      <text x="35" y="132">129</text><text x="130" y="132">134</text><text x="245" y="132" font-weight="bold">21</text>
      <text x="35" y="158">135</text><text x="130" y="158">139</text><text x="245" y="158" font-weight="bold">22</text>
      <text x="35" y="184">140</text><text x="130" y="184">146</text><text x="245" y="184" font-weight="bold">23</text>
      <text x="35" y="210">147</text><text x="130" y="210">152</text><text x="245" y="210" font-weight="bold">24</text>
      <text x="35" y="236">153</text><text x="130" y="236">159</text><text x="245" y="236" font-weight="bold">25</text>
      <!-- Row 26 (Highlight) -->
      
      <text x="35" y="265" fill="#334155">160</text>
      <text x="130" y="265" fill="#334155">166</text>
      <text x="245" y="265" font-weight="bold">26</text>
    </g>
  </g>

  <!-- Right Table (Sizes 27 to 35) -->
  <g transform="translate(350, 58)" filter="url(#sh)">
    <rect width="305" height="295" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <!-- Table Header -->
    <rect width="305" height="32" rx="8" fill="#e0e7ff"/>
    <rect y="24" width="305" height="8" fill="#e0e7ff"/>
    <text x="20" y="21" font-size="11" font-weight="bold" fill="#3730a3">ចាប់ពី (mm)</text>
    <text x="110" y="21" font-size="11" font-weight="bold" fill="#3730a3">ទៅដល់ (mm)</text>
    <text x="215" y="21" font-size="11" font-weight="bold" fill="#3730a3">ទំហំស្បែកជើង</text>

    <!-- Rows 27 to 35 -->
    <g font-size="11" fill="#334155">
      <text x="35" y="54">167</text><text x="130" y="54">172</text><text x="245" y="54" font-weight="bold">27</text>
      <text x="35" y="80">173</text><text x="130" y="80">179</text><text x="245" y="80" font-weight="bold">28</text>
      <text x="35" y="106">180</text><text x="130" y="106">186</text><text x="245" y="106" font-weight="bold">29</text>
      <text x="35" y="132">187</text><text x="130" y="132">192</text><text x="245" y="132" font-weight="bold">30</text>
      <text x="35" y="158">193</text><text x="130" y="158">199</text><text x="245" y="158" font-weight="bold">31</text>
      <text x="35" y="184">200</text><text x="130" y="184">206</text><text x="245" y="184" font-weight="bold">32</text>
      <text x="35" y="210">207</text><text x="130" y="210">212</text><text x="245" y="210" font-weight="bold">33</text>
      <text x="35" y="236">213</text><text x="130" y="236">219</text><text x="245" y="236" font-weight="bold">34</text>
      <text x="35" y="262">220</text><text x="130" y="262">226</text><text x="245" y="262" font-weight="bold">35</text>
    </g>
  </g>

  <!-- Question Footer Note -->
  <g transform="translate(25, 365)" filter="url(#sh)">
    <rect width="630" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="20" y="24" font-size="12" font-weight="bold" fill="#0f172a">ទិន្នន័យរបស់ ម៉ារី (Mary) ៖</text>
    <text x="20" y="44" font-size="12" fill="#334155">បាតជើងរបស់ ម៉ារី មានប្រវែង <tspan font-weight="bold" fill="#0284c7">163 mm</tspan>។ តើទំហំស្បែកជើងលេខប៉ុន្មាន ដែលនាងគួរទិញយកមកប្រើ?</text>
  </g>
</svg>