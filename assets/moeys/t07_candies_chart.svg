<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect x="5" y="5" width="670" height="420" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="32" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">ចំនួនគ្រាប់ស្ករគ្រាប់តាមពណ៌នីមួយៗក្នុងថង់</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#64748b">វិបុលចាប់យកស្ករ ១ គ្រាប់ដោយចៃដន្យពីក្នុងថង់ (មើលមិនឃើញ)</text>

  <!-- Bar Chart Area -->
  <g transform="translate(50, 70)" filter="url(#sh)">
    <rect width="580" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Y grid lines (0 to 8) -->
    <!-- 8 -->
    <line x1="55" y1="30" x2="555" y2="30" stroke="#e2e8f0" stroke-dasharray="3,3"/>
    <text x="45" y="34" text-anchor="end" font-size="11.5" fill="#64748b">8</text>
    <!-- 6 -->
    <line x1="55" y1="75" x2="555" y2="75" stroke="#e2e8f0" stroke-dasharray="3,3"/>
    <text x="45" y="79" text-anchor="end" font-size="11.5" fill="#64748b">6</text>
    <!-- 4 -->
    <line x1="55" y1="120" x2="555" y2="120" stroke="#e2e8f0" stroke-dasharray="3,3"/>
    <text x="45" y="124" text-anchor="end" font-size="11.5" fill="#64748b">4</text>
    <!-- 2 -->
    <line x1="55" y1="165" x2="555" y2="165" stroke="#e2e8f0" stroke-dasharray="3,3"/>
    <text x="45" y="169" text-anchor="end" font-size="11.5" fill="#64748b">2</text>
    <!-- 0 Baseline -->
    <line x1="55" y1="210" x2="555" y2="210" stroke="#0f172a" stroke-width="1.5"/>
    <text x="45" y="214" text-anchor="end" font-size="11.5" font-weight="bold" fill="#0f172a">0</text>
    <text x="20" y="120" font-size="11" fill="#64748b" transform="rotate(-90 20 120)" text-anchor="middle">ចំនួនគ្រាប់ស្ករ</text>

    <!-- 8 Bars (Scale: 1 unit = 22.5px. Y = 210 - count * 22.5) -->
    <!-- 1. Red: 6 (Height: 135, Y: 75) -->
    <rect x="75" y="75" width="44" height="135" rx="4" fill="#ef4444" stroke="#b91c1c" stroke-width="1.2"/>
    <text x="97" y="67" text-anchor="middle" font-size="12" font-weight="bold" fill="#b91c1c">6</text>
    <text x="97" y="230" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">ក្រហម</text>

    <!-- 2. Orange: 5 (Height: 112.5, Y: 97.5) -->
    <rect x="135" y="97.5" width="44" height="112.5" rx="4" fill="#f97316" stroke="#c2410c" stroke-width="1.2"/>
    <text x="157" y="89.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#c2410c">5</text>
    <text x="157" y="230" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">ទឹកក្រូច</text>

    <!-- 3. Yellow: 3 (Height: 67.5, Y: 142.5) -->
    <rect x="195" y="142.5" width="44" height="67.5" rx="4" fill="#eab308" stroke="#a16207" stroke-width="1.2"/>
    <text x="217" y="134.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#a16207">3</text>
    <text x="217" y="230" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">លឿង</text>

    <!-- 4. Green: 3 (Height: 67.5, Y: 142.5) -->
    <rect x="255" y="142.5" width="44" height="67.5" rx="4" fill="#22c55e" stroke="#15803d" stroke-width="1.2"/>
    <text x="277" y="134.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#15803d">3</text>
    <text x="277" y="230" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">បៃតង</text>

    <!-- 5. Blue: 2 (Height: 45, Y: 165) -->
    <rect x="315" y="165" width="44" height="45" rx="4" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="337" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d4ed8">2</text>
    <text x="337" y="230" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">ខៀវ</text>

    <!-- 6. Pink: 4 (Height: 90, Y: 120) -->
    <rect x="375" y="120" width="44" height="90" rx="4" fill="#ec4899" stroke="#be185d" stroke-width="1.2"/>
    <text x="397" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#be185d">4</text>
    <text x="397" y="230" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">ផ្កាឈូក</text>

    <!-- 7. Purple: 2 (Height: 45, Y: 165) -->
    <rect x="435" y="165" width="44" height="45" rx="4" fill="#a855f7" stroke="#7e22ce" stroke-width="1.2"/>
    <text x="457" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e22ce">2</text>
    <text x="457" y="230" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">ស្វាយ</text>

    <!-- 8. Brown: 5 (Height: 112.5, Y: 97.5) -->
    <rect x="495" y="97.5" width="44" height="112.5" rx="4" fill="#a16207" stroke="#713f12" stroke-width="1.2"/>
    <text x="517" y="89.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12">5</text>
    <text x="517" y="230" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">ត្នោត</text>

    <!-- Footer Summary note -->
    <text x="290" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">ចំនួនគ្រាប់ស្ករសរុបទាំងអស់ក្នុងថង់ ៖ 6 + 5 + 3 + 3 + 2 + 4 + 2 + 5 = 30 គ្រាប់</text>
  </g>

  <!-- Question Prompt Note -->
  <g transform="translate(50, 365)" filter="url(#sh)">
    <rect width="580" height="45" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
    <text x="20" y="28" font-size="12" fill="#991b1b">❓ តើប្រូបាបដែលវិបុលចាប់បានស្ករគ្រាប់ <tspan font-weight="bold">ពណ៌ក្រហម</tspan> ស្មើនឹងប៉ុន្មានភាគរយ (%)?</text>
  </g>
</svg>