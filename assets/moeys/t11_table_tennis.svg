<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
  </defs>
  <rect x="5" y="5" width="670" height="420" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="32" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">ការប្រកួតវាយប៉េងប៉ុងវិលជុំ (Table Tennis Tournament)</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#64748b">កីឡាករ ៤ នាក់ ៖ បូរិន, ចន្ថា, រតនា, សុភ័ក្ត្រ (ម្នាក់ៗត្រូវជួបគ្នា ១ លើកគត់ ដោយប្រើតុ ២)</text>

  <!-- Tournament Schedule Card -->
  <g transform="translate(30, 75)" filter="url(#sh)">
    <rect width="620" height="245" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="620" height="38" rx="8" fill="#e0e7ff"/>
    <rect y="28" width="620" height="10" fill="#e0e7ff"/>
    <text x="30" y="25" font-size="13" font-weight="bold" fill="#3730a3">ជុំប្រកួត</text>
    <text x="220" y="25" font-size="13" font-weight="bold" fill="#3730a3">🏓 តុទី ១</text>
    <text x="440" y="25" font-size="13" font-weight="bold" fill="#3730a3">🏓 តុទី ២</text>

    <!-- Round 1 -->
    <line x1="20" y1="100" x2="600" y2="100" stroke="#f1f5f9" stroke-width="1.5"/>
    <text x="30" y="75" font-size="12.5" font-weight="bold" fill="#0f172a">ជុំទី ១ (កំណត់រួច)</text>
    <rect x="180" y="55" width="180" height="30" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="270" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">បូរិន — ចន្ថា</text>
    <rect x="400" y="55" width="180" height="30" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="490" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#166534">រតនា — សុភ័ក្ត្រ</text>

    <!-- Round 2 -->
    <line x1="20" y1="165" x2="600" y2="165" stroke="#f1f5f9" stroke-width="1.5"/>
    <text x="30" y="140" font-size="12.5" font-weight="bold" fill="#0f172a">ជុំទី ២ (?)</text>
    <rect x="180" y="120" width="180" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="270" y="140" text-anchor="middle" font-size="12" fill="#1d4ed8">…………… — ……………</text>
    <rect x="400" y="120" width="180" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="490" y="140" text-anchor="middle" font-size="12" fill="#1d4ed8">…………… — ……………</text>

    <!-- Round 3 -->
    <text x="30" y="205" font-size="12.5" font-weight="bold" fill="#0f172a">ជុំទី ៣ (?)</text>
    <rect x="180" y="185" width="180" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="270" y="205" text-anchor="middle" font-size="12" fill="#1d4ed8">…………… — ……………</text>
    <rect x="400" y="185" width="180" height="30" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="490" y="205" text-anchor="middle" font-size="12" fill="#1d4ed8">…………… — ……………</text>
  </g>

  <!-- Rule info box -->
  <g transform="translate(30, 335)" filter="url(#sh)">
    <rect width="620" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="16" y="24" font-size="12" font-weight="bold" fill="#0f172a">គោលការណ៍ប្រកួត ៖</text>
    <text x="16" y="46" font-size="11.5" fill="#334155">• កីឡាករម្នាក់ៗត្រូវជួបកីឡាករ ៣ នាក់ផ្សេងទៀតឱ្យបានគ្រប់ៗគ្នា ដោយមិនលេងជាន់គ្នាលើតុតែមួយ។</text>
    <text x="16" y="66" font-size="11.5" fill="#64748b">• សរុបមាន ៦ ការប្រកួត៖ ជុំទី ១ (២ ប្រកួត), ជុំទី ២ (២ ប្រកួត), និងជុំទី ៣ (២ ប្រកួត)។</text>
  </g>
</svg>