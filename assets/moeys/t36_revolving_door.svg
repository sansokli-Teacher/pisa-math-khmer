<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="100%" height="100%">
  <rect width="740" height="440" fill="#f8fafc" rx="12"/>
  
  <rect x="30" y="20" width="680" height="42" rx="8" fill="#0d2b45"/>
  <text x="370" y="47" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ប្លង់ទ្វារវិលស្លាប ៣ (Revolving Door Geometry)</text>
  
  <!-- Left Side: Circular Top View Diagram -->
  <rect x="30" y="80" width="370" height="335" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Revolving door outer circle: Center (215, 235), radius 100px (representing 100cm) -->
  <!-- Top Curved Wall -->
  <path d="M 125 190 A 100 100 0 0 1 305 190" fill="none" stroke="#334155" stroke-width="8"/>
  <!-- Bottom Curved Wall -->
  <path d="M 125 280 A 100 100 0 0 0 305 280" fill="none" stroke="#334155" stroke-width="8"/>
  
  <!-- Dashed Entry & Exit Door Openings -->
  <!-- Left opening (Entry) -->
  <path d="M 125 190 A 100 100 0 0 0 125 280" fill="none" stroke="#0284c7" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="80" y="240" fill="#0284c7" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700" text-anchor="middle">ច្រកចូល</text>
  <!-- Right opening (Exit) -->
  <path d="M 305 190 A 100 100 0 0 1 305 280" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="350" y="240" fill="#16a34a" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700" text-anchor="middle">ច្រកចេញ</text>

  <!-- Central Pivot -->
  <circle cx="215" cy="235" r="8" fill="#0f172a"/>
  
  <!-- 3 Wings at 120 degrees -->
  <!-- Wing 1 (Up at 90 deg: dy = -100) -->
  <line x1="215" y1="235" x2="215" y2="135" stroke="#ea580c" stroke-width="4"/>
  <!-- Wing 2 (Lower right at -30 deg: dx = 86.6, dy = 50) -->
  <line x1="215" y1="235" x2="301" y2="285" stroke="#ea580c" stroke-width="4"/>
  <!-- Wing 3 (Lower left at 210 deg: dx = -86.6, dy = 50) -->
  <line x1="215" y1="235" x2="129" y2="285" stroke="#ea580c" stroke-width="4"/>

  <!-- Angle arc between Wing 1 and Wing 2: 120° -->
  <path d="M 215 195 A 40 40 0 0 1 250 255" fill="none" stroke="#ea580c" stroke-width="2"/>
  <text x="250" y="205" fill="#ea580c" font-family="'Noto Sans Khmer', sans-serif" font-size="13" font-weight="700">120°</text>

  <!-- Rotation direction arrow -->
  <path d="M 175 145 A 70 70 0 0 1 255 145" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow)"/>
  
  <text x="215" y="380" fill="#475569" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    អង្កត់ផ្ចិត 200 cm (កាំ 100 cm) | ស្លាបទ្វារ 3 បែងចែក 120°
  </text>

  <!-- Right Side: Specs & Formula Breakdown -->
  <rect x="420" y="80" width="290" height="335" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="565" y="110" fill="#0d2b45" font-family="'Noto Sans Khmer', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ការគណនាក្នុងទ្វារវិល</text>
  
  <!-- Question 1 Card -->
  <rect x="435" y="130" width="260" height="60" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="445" y="152" fill="#1e40af" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700">សំណួរទី ១ (មុំស្លាបទាំងពីរ) ៖</text>
  <text x="445" y="174" fill="#1e3a8a" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• មុំ = 360° ÷ 3 = <b>120°</b> (ឬ 240°)</text>

  <!-- Question 2 Card -->
  <rect x="435" y="200" width="260" height="95" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="445" y="222" fill="#9a3412" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700">សំណួរទី ២ (ប្រវែងធនូបើកអតិបរមា) ៖</text>
  <text x="445" y="242" fill="#7c2d12" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5">• ដើម្បីកុំឱ្យខ្យល់ចេញចូលដោយសេរី</text>
  <text x="445" y="260" fill="#7c2d12" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5">• ធនូបើក ≤ 1/6 នៃបរិមាត្ររង្វង់</text>
  <text x="445" y="280" fill="#c2410c" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700">• L = (2π × 100) ÷ 6 ≈ 104.7 cm (103 - 105 cm)</text>

  <!-- Question 3 Card -->
  <rect x="435" y="305" width="260" height="95" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="445" y="325" fill="#166534" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700">សំណួរទី ៣ (ចំនួនមនុស្សក្នុង 30 នាទី) ៖</text>
  <text x="445" y="345" fill="#14532d" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5">• ល្បឿន 4 ជុំ/នាទី | 3 បន្ទប់ | 2 នាក់/បន្ទប់</text>
  <text x="445" y="365" fill="#14532d" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5">• មនុស្ស/នាទី = 4 × 3 × 2 = 24 នាក់</text>
  <text x="445" y="387" fill="#16a34a" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700">• ក្នុង 30 នាទី = 24 × 30 = 720 នាក់ (ឃ)</text>
</svg>
