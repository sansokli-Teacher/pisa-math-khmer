<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
  </defs>
  <rect x="5" y="5" width="670" height="420" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="30" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">ប្លង់បាតអាផាតមិន (Apartment Floor Plan)</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#64748b">មាត្រដ្ឋាន ៖ 1 ឯកតាក្នុងប្លង់ = 1 ម៉ែត្រ (m)</text>

  <!-- Apartment Outline (Bounding Box 9.7m x 8.8m minus corner 2m x 4.4m) -->
  <g transform="translate(140, 72)" filter="url(#sh)">
    <!-- Main L-shaped Apartment polygon -->
    <!-- Scale: 40px = 1m. Width = 9.7m (388px), Height = 8.8m (352px). Corner cut = 2.0m x 4.4m (80px x 176px) -->
    <!-- Using scaled down box 360 x 280 -->
    <path d="M 40,30 L 360,30 L 360,160 L 280,160 L 280,270 L 40,270 Z" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5"/>

    <!-- Internal rooms divider dashes -->
    <line x1="40" y1="130" x2="200" y2="130" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="200" y1="30" x2="200" y2="190" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <line x1="200" y1="190" x2="280" y2="190" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

    <text x="110" y="85" text-anchor="middle" font-size="12" fill="#64748b">បន្ទប់គេង ១</text>
    <text x="110" y="200" text-anchor="middle" font-size="12" fill="#64748b">បន្ទប់គេង ២</text>
    <text x="280" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">បន្ទប់ទទួលភ្ញៀវ</text>
    <text x="240" y="230" text-anchor="middle" font-size="11.5" fill="#64748b">ផ្ទះបាយ / បន្ទប់ទឹក</text>

    <!-- Cut-out corner note -->
    <rect x="280" y="160" width="80" height="110" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="320" y="220" text-anchor="middle" font-size="10.5" fill="#94a3b8">រានហាលក្រៅ</text>

    <!-- Dimension arrows for the 4 critical measurements -->
    <!-- Top Full Width (9.7 m) -->
    <line x1="40" y1="15" x2="360" y2="15" stroke="#0284c7" stroke-width="1.5"/>
    <text x="200" y="10" text-anchor="middle" font-size="11" font-weight="bold" fill="#0284c7">ប្រវែងសរុប 9.7 m</text>

    <!-- Left Full Height (8.8 m) -->
    <line x1="20" y1="30" x2="20" y2="270" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="150" font-size="11" font-weight="bold" fill="#0284c7" transform="rotate(-90 12 150)" text-anchor="middle">ទទឹងសរុប 8.8 m</text>

    <!-- Cut-out width (2.0 m) -->
    <line x1="280" y1="285" x2="360" y2="285" stroke="#dc2626" stroke-width="1.5"/>
    <text x="320" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">កាត់ចេញ 2.0 m</text>

    <!-- Cut-out height (4.4 m) -->
    <line x1="375" y1="160" x2="375" y2="270" stroke="#dc2626" stroke-width="1.5"/>
    <text x="385" y="215" font-size="11" font-weight="bold" fill="#dc2626" transform="rotate(90 385 215)" text-anchor="middle">កាត់ចេញ 4.4 m</text>
  </g>

  <!-- Problem Explanation at bottom -->
  <g transform="translate(50, 375)">
    <text x="300" y="20" text-anchor="middle" font-size="12" fill="#0f172a">💡 រូបមន្តគណនាផ្ទៃក្រឡា ៖ <b>A = (9.7 m × 8.8 m) - (2.0 m × 4.4 m) = 76.56 m²</b></text>
  </g>
</svg>