<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="100%" height="100%">
  <rect width="740" height="440" fill="#f8fafc" rx="12"/>
  
  <rect x="30" y="20" width="680" height="42" rx="8" fill="#0d2b45"/>
  <text x="370" y="47" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="15" font-weight="700" text-anchor="middle">លក្ខណៈវិនិច្ឆ័យតម្លៃផ្ទះលំហែ (Holiday House Valuation)</text>
  
  <!-- Left Side: Table of expert criteria -->
  <rect x="30" y="80" width="370" height="335" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="215" y="110" fill="#0d2b45" font-family="'Noto Sans Khmer', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">តារាងវាយតម្លៃរបស់អ្នកជំនាញ</text>
  
  <g font-family="'Noto Sans Khmer', sans-serif" font-size="11.5">
    <!-- Base price -->
    <rect x="45" y="125" width="340" height="28" fill="#f1f5f9"/>
    <text x="55" y="144" fill="#0f172a" font-weight="700">តម្លៃមូលដ្ឋាន ៖</text>
    <text x="375" y="144" fill="#0f172a" font-weight="700" text-anchor="end">150 000 zeds</text>
    
    <!-- Area -->
    <rect x="45" y="158" width="340" height="28" fill="#ffffff"/>
    <text x="55" y="177" fill="#334155">ផ្ទៃក្រឡា 95 m² (ចន្លោះ 75 - 100 m²)</text>
    <text x="375" y="177" fill="#0284c7" font-weight="700" text-anchor="end">+15 000 zeds</text>

    <!-- Travel time from station -->
    <rect x="45" y="191" width="340" height="28" fill="#f1f5f9"/>
    <text x="55" y="210" fill="#334155">ពេលដើរពីស្ថានីយ 9 នាទី (5 ទៅ 15 នាទី)</text>
    <text x="375" y="210" fill="#0284c7" font-weight="700" text-anchor="end">+10 000 zeds</text>

    <!-- Distance to beach -->
    <rect x="45" y="224" width="340" height="28" fill="#ffffff"/>
    <text x="55" y="243" fill="#334155">ចម្ងាយពីឆ្នេរ 0.8 km (0.5 ទៅ 1 km)</text>
    <text x="375" y="243" fill="#0284c7" font-weight="700" text-anchor="end">+10 000 zeds</text>

    <!-- Garage -->
    <rect x="45" y="257" width="340" height="28" fill="#f1f5f9"/>
    <text x="55" y="276" fill="#334155">កន្លែងចតរថយន្ត (គ្មានកន្លែងចត)</text>
    <text x="375" y="276" fill="#64748b" font-weight="700" text-anchor="end">+0 zeds</text>

    <!-- Total Expert Valuation -->
    <rect x="45" y="295" width="340" height="35" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="55" y="318" fill="#065f46" font-weight="700">តម្លៃវាយតម្លៃសរុប ៖</text>
    <text x="375" y="318" fill="#047857" font-size="14" font-weight="700" text-anchor="end">210 000 zeds</text>

    <!-- Advertised Price Comparison -->
    <rect x="45" y="340" width="340" height="35" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="55" y="363" fill="#9a3412" font-weight="700">តម្លៃដាក់លក់ផ្សាយ ៖</text>
    <text x="375" y="363" fill="#c2410c" font-size="14" font-weight="700" text-anchor="end">200 000 zeds</text>

    <text x="215" y="398" fill="#16a34a" font-weight="700" text-anchor="middle">
      210 000 &gt; 200 000 → ជាឱកាស "ល្អណាស់"
    </text>
  </g>

  <!-- Right Side: Vacation rental 10-year occupancy statement -->
  <rect x="420" y="80" width="290" height="335" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="565" y="110" fill="#0d2b45" font-family="'Noto Sans Khmer', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">សំណួរទី ២ ៖ ការវិភាគស្ថិតិមធ្យម</text>
  
  <rect x="435" y="130" width="260" height="60" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="565" y="152" fill="#334155" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5" text-anchor="middle">មធ្យមភាគជួលស្នាក់នៅ ១០ ឆ្នាំ ៖</text>
  <text x="565" y="174" fill="#0284c7" font-family="'Noto Sans Khmer', sans-serif" font-size="14" font-weight="700" text-anchor="middle">315 ថ្ងៃ ក្នុងមួយឆ្នាំ</text>

  <!-- Statements summary -->
  <rect x="435" y="205" width="260" height="55" rx="6" fill="#fef2f2"/>
  <text x="445" y="225" fill="#991b1b" font-family="'Noto Sans Khmer', sans-serif" font-size="11" font-weight="700">អំណះអំណាង ១ ៖</text>
  <text x="445" y="243" fill="#7f1d1d" font-family="'Noto Sans Khmer', sans-serif" font-size="11">ប្រាកដជាមានយ៉ាងហោច ១ ឆ្នាំបាន 315 ថ្ងៃ → <b>ទេ</b></text>

  <rect x="435" y="268" width="260" height="55" rx="6" fill="#fef2f2"/>
  <text x="445" y="288" fill="#991b1b" font-family="'Noto Sans Khmer', sans-serif" font-size="11" font-weight="700">អំណះអំណាង ២ ៖</text>
  <text x="445" y="306" fill="#7f1d1d" font-family="'Noto Sans Khmer', sans-serif" font-size="11">អាចស្នាក់លើស 315 ថ្ងៃរៀងរាល់ឆ្នាំ → <b>ទេ</b></text>

  <rect x="435" y="331" width="260" height="55" rx="6" fill="#f0fdf4"/>
  <text x="445" y="351" fill="#166534" font-family="'Noto Sans Khmer', sans-serif" font-size="11" font-weight="700">អំណះអំណាង ៣ ៖</text>
  <text x="445" y="369" fill="#14532d" font-family="'Noto Sans Khmer', sans-serif" font-size="11">អាចមិនមានស្នាក់នៅទាល់តែសោះ (0 ថ្ងៃ) → <b>បាទ/ចាស</b></text>
</svg>
