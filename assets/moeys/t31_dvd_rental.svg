<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <rect width="700" height="420" fill="#f8fafc" rx="12"/>
  
  <rect x="30" y="20" width="640" height="42" rx="8" fill="#0d2b45"/>
  <text x="350" y="47" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="15" font-weight="700" text-anchor="middle">តារាងតម្លៃជួលឌីវីឌី (DVD Rental Pricing Plans)</text>
  
  <!-- Non Member Card -->
  <rect x="40" y="85" width="295" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="85" width="295" height="35" rx="10" fill="#64748b"/>
  <rect x="40" y="110" width="295" height="10" fill="#64748b"/>
  <text x="187" y="108" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">អ្នកមិនមែនជាសមាជិក</text>
  <text x="187" y="150" fill="#0f172a" font-family="'Noto Sans Khmer', sans-serif" font-size="13">• គ្មានថ្លៃសមាជិកភាពប្រចាំឆ្នាំ (0 zeds)</text>
  <text x="187" y="180" fill="#0284c7" font-family="'Noto Sans Khmer', sans-serif" font-size="16" font-weight="700" text-anchor="middle">3.20 Zeds / ឌីវីឌី 1 បន្ទះ</text>
  <text x="187" y="210" fill="#64748b" font-family="'Noto Sans Khmer', sans-serif" font-size="12" text-anchor="middle">រូបមន្តចំណាយ ៖ C = 3.20 × n</text>

  <!-- Member Card -->
  <rect x="365" y="85" width="295" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="365" y="85" width="295" height="35" rx="10" fill="#0284c7"/>
  <rect x="365" y="110" width="295" height="10" fill="#0284c7"/>
  <text x="512" y="108" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">សមាជិកក្លឹប</text>
  <text x="512" y="150" fill="#0f172a" font-family="'Noto Sans Khmer', sans-serif" font-size="13">• ថ្លៃកាតសមាជិកប្រចាំឆ្នាំ ៖ <b>10 Zeds</b></text>
  <text x="512" y="180" fill="#0284c7" font-family="'Noto Sans Khmer', sans-serif" font-size="16" font-weight="700" text-anchor="middle">2.50 Zeds / ឌីវីឌី 1 បន្ទះ</text>
  <text x="512" y="210" fill="#64748b" font-family="'Noto Sans Khmer', sans-serif" font-size="12" text-anchor="middle">រូបមន្តចំណាយ ៖ C = 10 + 2.50 × n</text>

  <!-- Comparison & Breakeven Analysis Table -->
  <rect x="40" y="255" width="620" height="140" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="350" y="280" fill="#0d2b45" font-family="'Noto Sans Khmer', sans-serif" font-size="13" font-weight="700" text-anchor="middle">តារាងប្រៀបធៀបថ្លៃចំណាយតាមចំនួនឌីវីឌី (n)</text>
  
  <g font-family="'Noto Sans Khmer', sans-serif" font-size="12">
    <rect x="60" y="295" width="580" height="25" fill="#f1f5f9"/>
    <text x="120" y="312" fill="#475569" font-weight="700" text-anchor="middle">ចំនួនឌីវីឌី (n)</text>
    <text x="240" y="312" fill="#475569" font-weight="700" text-anchor="middle">មិនមែនសមាជិក (3.20n)</text>
    <text x="380" y="312" fill="#475569" font-weight="700" text-anchor="middle">សមាជិក (10 + 2.50n)</text>
    <text x="530" y="312" fill="#475569" font-weight="700" text-anchor="middle">ការសន្សំ / ប្រៀបធៀប</text>

    <!-- n = 14 -->
    <text x="120" y="337" fill="#334155" text-anchor="middle">14 បន្ទះ</text>
    <text x="240" y="337" fill="#334155" text-anchor="middle">44.80 zeds</text>
    <text x="380" y="337" fill="#334155" text-anchor="middle">45.00 zeds</text>
    <text x="530" y="337" fill="#dc2626" font-weight="700" text-anchor="middle">មិនមែនសមាជិកថោកជាង</text>

    <!-- n = 15 -->
    <rect x="60" y="347" width="580" height="24" fill="#ecfdf5"/>
    <text x="120" y="364" fill="#065f46" font-weight="700" text-anchor="middle">15 បន្ទះ</text>
    <text x="240" y="364" fill="#065f46" text-anchor="middle">48.00 zeds</text>
    <text x="380" y="364" fill="#065f46" text-anchor="middle">47.50 zeds</text>
    <text x="530" y="364" fill="#16a34a" font-weight="700" text-anchor="middle">សមាជិកចាប់ផ្តើមចំណេញ!</text>

    <!-- n = 17 (Vasna) -->
    <text x="120" y="387" fill="#334155" text-anchor="middle">17 បន្ទះ (វាសនា)</text>
    <text x="240" y="387" fill="#0284c7" font-weight="700" text-anchor="middle">54.40 zeds</text>
    <text x="380" y="387" fill="#334155" text-anchor="middle">52.50 zeds</text>
    <text x="530" y="387" fill="#0284c7" font-weight="700" text-anchor="middle">សន្សំបាន 1.90 zeds</text>
  </g>
</svg>
