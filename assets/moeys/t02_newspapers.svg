<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="5" y="5" width="670" height="420" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="340" y="32" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">ទិន្នន័យស្ទង់មតិស្តីពីការគាំទ្រប្រធានាធិបតី (Zedland)</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#475569">កាលបរិច្ឆេទនៃការបោះឆ្នោតផ្លូវការ ៖ <tspan font-weight="bold" fill="#b91c1c">ថ្ងៃទី ២៥ ខែមករា</tspan></text>

  <!-- Card 1: Newspaper 1 -->
  <g transform="translate(25, 68)" filter="url(#cardShadow)">
    <rect width="300" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="300" height="34" rx="8" fill="#e0e7ff"/>
    <rect y="24" width="300" height="10" fill="#e0e7ff"/>
    <text x="16" y="23" font-size="13" font-weight="bold" fill="#3730a3">កាសែតទី ១</text>
    <rect x="215" y="6" width="72" height="22" rx="11" fill="#4338ca"/>
    <text x="251" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">36.5%</text>

    <!-- Details -->
    <text x="16" y="62" font-size="12" fill="#334155"><tspan font-weight="600" fill="#475569">កាលបរិច្ឆេទ ៖</tspan> ថ្ងៃទី ៦ ខែមករា</text>
    <text x="16" y="88" font-size="12" fill="#334155"><tspan font-weight="600" fill="#475569">ទំហំសំណាក ៖</tspan> 500 នាក់ (មានសិទ្ធិបោះឆ្នោត)</text>
    <text x="16" y="114" font-size="12" fill="#334155"><tspan font-weight="600" fill="#475569">វិធីសាស្ត្រ ៖</tspan> ជ្រើសរើសដោយចៃដន្យ</text>
    <rect x="16" y="126" width="268" height="18" rx="4" fill="#f8fafc"/>
    <text x="26" y="139" font-size="10.5" fill="#64748b">📅 ស្ទង់មតិ ១៩ ថ្ងៃ មុនថ្ងៃបោះឆ្នោត</text>
  </g>

  <!-- Card 2: Newspaper 2 -->
  <g transform="translate(355, 68)" filter="url(#cardShadow)">
    <rect width="300" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="300" height="34" rx="8" fill="#e0f2fe"/>
    <rect y="24" width="300" height="10" fill="#e0f2fe"/>
    <text x="16" y="23" font-size="13" font-weight="bold" fill="#0369a1">កាសែតទី ២</text>
    <rect x="215" y="6" width="72" height="22" rx="11" fill="#0284c7"/>
    <text x="251" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">41.0%</text>

    <!-- Details -->
    <text x="16" y="62" font-size="12" fill="#334155"><tspan font-weight="600" fill="#475569">កាលបរិច្ឆេទ ៖</tspan> ថ្ងៃទី ២០ ខែមករា</text>
    <text x="16" y="88" font-size="12" fill="#334155"><tspan font-weight="600" fill="#475569">ទំហំសំណាក ៖</tspan> 500 នាក់ (មានសិទ្ធិបោះឆ្នោត)</text>
    <text x="16" y="114" font-size="12" fill="#334155"><tspan font-weight="600" fill="#475569">វិធីសាស្ត្រ ៖</tspan> ជ្រើសរើសដោយចៃដន្យ</text>
    <rect x="16" y="126" width="268" height="18" rx="4" fill="#f8fafc"/>
    <text x="26" y="139" font-size="10.5" fill="#64748b">📅 ស្ទង់មតិ ៥ ថ្ងៃ មុនថ្ងៃបោះឆ្នោត</text>
  </g>

  <!-- Card 3: Newspaper 3 -->
  <g transform="translate(25, 230)" filter="url(#cardShadow)">
    <rect width="300" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="300" height="34" rx="8" fill="#ecfdf5"/>
    <rect y="24" width="300" height="10" fill="#ecfdf5"/>
    <text x="16" y="23" font-size="13" font-weight="bold" fill="#065f46">កាសែតទី ៣</text>
    <rect x="215" y="6" width="72" height="22" rx="11" fill="#059669"/>
    <text x="251" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">39.0%</text>

    <!-- Details -->
    <text x="16" y="62" font-size="12" fill="#334155"><tspan font-weight="600" fill="#475569">កាលបរិច្ឆេទ ៖</tspan> ថ្ងៃទី ២០ ខែមករា</text>
    <text x="16" y="88" font-size="12" fill="#334155"><tspan font-weight="600" fill="#475569">ទំហំសំណាក ៖</tspan> 1000 នាក់ (មានសិទ្ធិបោះឆ្នោត)</text>
    <text x="16" y="114" font-size="12" fill="#334155"><tspan font-weight="600" fill="#475569">វិធីសាស្ត្រ ៖</tspan> ជ្រើសរើសដោយចៃដន្យ</text>
    <rect x="16" y="126" width="268" height="18" rx="4" fill="#f8fafc"/>
    <text x="26" y="139" font-size="10.5" fill="#64748b">📅 ស្ទង់មតិ ៥ ថ្ងៃ មុនថ្ងៃបោះឆ្នោត</text>
  </g>

  <!-- Card 4: Newspaper 4 -->
  <g transform="translate(355, 230)" filter="url(#cardShadow)">
    <rect width="300" height="145" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="300" height="34" rx="8" fill="#fff7ed"/>
    <rect y="24" width="300" height="10" fill="#fff7ed"/>
    <text x="16" y="23" font-size="13" font-weight="bold" fill="#9a3412">កាសែតទី ៤</text>
    <rect x="215" y="6" width="72" height="22" rx="11" fill="#ea580c"/>
    <text x="251" y="21" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">44.5%</text>

    <!-- Details -->
    <text x="16" y="62" font-size="12" fill="#334155"><tspan font-weight="600" fill="#475569">កាលបរិច្ឆេទ ៖</tspan> ថ្ងៃទី ២០ ខែមករា</text>
    <text x="16" y="88" font-size="12" fill="#334155"><tspan font-weight="600" fill="#475569">ទំហំសំណាក ៖</tspan> 1000 នាក់ (អ្នកអានទូរស័ព្ទមក)</text>
    <text x="16" y="114" font-size="12" fill="#334155"><tspan font-weight="600" fill="#475569">វិធីសាស្ត្រ ៖</tspan> អ្នកអានទូរស័ព្ទមកបោះឆ្នោត</text>
    <rect x="16" y="126" width="268" height="18" rx="4" fill="#f8fafc"/>
    <text x="26" y="139" font-size="10.5" fill="#64748b">📅 ស្ទង់មតិ ៥ ថ្ងៃ មុនថ្ងៃបោះឆ្នោត</text>
  </g>

  <!-- Timeline Bar at Bottom -->
  <g transform="translate(50, 392)">
    <line x1="10" y1="10" x2="570" y2="10" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
    
    <!-- 6 Jan -->
    <circle cx="50" cy="10" r="5" fill="#4338ca"/>
    <text x="50" y="26" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">៦ មករា (កាសែត ១)</text>

    <!-- 20 Jan -->
    <circle cx="320" cy="10" r="5.5" fill="#0284c7"/>
    <text x="320" y="26" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155">២០ មករា (កាសែត ២, ៣, ៤)</text>

    <!-- 25 Jan Election -->
    <circle cx="520" cy="10" r="6.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
    <text x="520" y="26" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b91c1c">២៥ មករា (ថ្ងៃបោះឆ្នោត)</text>
  </g>
</svg>