<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
    <linearGradient id="spaceGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/></linearGradient>
  </defs>
  <rect x="5" y="5" width="670" height="420" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="32" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">ទិន្នន័យនៃការហោះហើររបស់ស្ថានីយអវកាស មៀរ៍ (Mir)</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#64748b">គន្លងគោចរជុំវិញផែនដី និងរយៈពេលស្នាក់នៅរបស់អវកាសយានិក</text>

  <!-- Visual Card -->
  <g transform="translate(30, 70)" filter="url(#sh)">
    <rect width="620" height="180" rx="8" fill="url(#spaceGrad)"/>
    <!-- Orbit Ellipse -->
    <ellipse cx="310" cy="90" rx="220" ry="55" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <!-- Earth circle -->
    <circle cx="310" cy="90" r="38" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <text x="310" y="94" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ផែនដី</text>
    <!-- Space Station Mir Icon -->
    <g transform="translate(480, 70)">
      <rect x="-16" y="-6" width="32" height="12" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <line x1="-24" y1="0" x2="24" y2="0" stroke="#38bdf8" stroke-width="2"/>
      <rect x="-28" y="-12" width="8" height="24" fill="#0284c7" stroke="#bae6fd" stroke-width="0.8"/>
      <rect x="20" y="-12" width="8" height="24" fill="#0284c7" stroke="#bae6fd" stroke-width="0.8"/>
      <text x="0" y="24" text-anchor="middle" font-size="10" font-weight="bold" fill="#f1f5f9">ស្ថានីយ មៀរ៍ (Mir)</text>
    </g>
  </g>

  <!-- 2 Metric Cards -->
  <g transform="translate(30, 265)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)" filter="url(#sh)">
      <rect width="295" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="295" height="30" rx="8" fill="#e0f2fe"/>
      <rect y="22" width="295" height="8" fill="#e0f2fe"/>
      <text x="16" y="20" font-size="12.5" font-weight="bold" fill="#0369a1">ទិន្នន័យស្ថានីយ មៀរ៍ (Mir)</text>
      <text x="16" y="58" font-size="12" fill="#334155">• រយៈពេលស្ថិតក្នុងគន្លង ៖ <tspan font-weight="bold">15 ឆ្នាំ</tspan></text>
      <text x="16" y="84" font-size="12" fill="#334155">• វិលជុំវិញផែនដីបាន ៖ <tspan font-weight="bold" fill="#0284c7">~86 500 ជុំ</tspan></text>
      <text x="16" y="110" font-size="11" fill="#64748b">អំឡុងពេលស្ថិតនៅក្នុងទីអវកាស</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(325, 0)" filter="url(#sh)">
      <rect width="295" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect width="295" height="30" rx="8" fill="#fef3c7"/>
      <rect y="22" width="295" height="8" fill="#fef3c7"/>
      <text x="16" y="20" font-size="12.5" font-weight="bold" fill="#92400e">កំណត់ត្រាអវកាសយានិក</text>
      <text x="16" y="58" font-size="12" fill="#334155">• ស្នាក់នៅវែងបំផុត ៖ <tspan font-weight="bold" fill="#d97706">~680 ថ្ងៃ</tspan></text>
      <text x="16" y="84" font-size="12" fill="#334155">• ចំនួនជុំប៉ាន់ស្មាន ៖ <tspan font-weight="bold">? ជុំ</tspan></text>
      <text x="16" y="110" font-size="11" fill="#64748b">គណនាសមាមាត្រតាមចំនួនថ្ងៃស្នាក់នៅ</text>
    </g>
  </g>
</svg>