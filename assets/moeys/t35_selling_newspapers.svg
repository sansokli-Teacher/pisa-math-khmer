<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" width="100%" height="100%">
  <rect width="740" height="430" fill="#f8fafc" rx="12"/>
  
  <rect x="30" y="20" width="680" height="42" rx="8" fill="#0d2b45"/>
  <text x="370" y="47" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="15" font-weight="700" text-anchor="middle">រចនាសម្ព័ន្ធកម្រៃលក់កាសែតនៅហ្ស៊ិតឡង់ (Newspaper Sales)</text>
  
  <!-- Left Side: Star vs Daily Job Ad Cards -->
  <rect x="30" y="80" width="310" height="325" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="185" y="110" fill="#0d2b45" font-family="'Noto Sans Khmer', sans-serif" font-size="14" font-weight="700" text-anchor="middle">លក្ខខណ្ឌកម្រៃរបស់ក្រុមហ៊ុនទាំងពីរ</text>
  
  <!-- Zedland Star -->
  <rect x="45" y="125" width="280" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="60" y="150" fill="#1e40af" font-family="'Noto Sans Khmer', sans-serif" font-size="13" font-weight="700">កាសែតស៊ីតដលែនស្តារ (The Star) ៖</text>
  <text x="60" y="175" fill="#1e3a8a" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• 240 ច្បាប់ដំបូង ៖ <b>0.20 zeds / ច្បាប់</b></text>
  <text x="60" y="197" fill="#1e3a8a" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• ច្បាប់បន្ថែមលើសពី 240 ៖ <b>0.40 zeds / ច្បាប់</b></text>
  <text x="60" y="222" fill="#0284c7" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5" font-weight="700">លក់ 350 ច្បាប់ → 48 + 44 = 92 zeds</text>

  <!-- Zedland Daily -->
  <rect x="45" y="260" width="280" height="125" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="60" y="285" fill="#166534" font-family="'Noto Sans Khmer', sans-serif" font-size="13" font-weight="700">កាសែតស៊ីតដលែនដេលី (The Daily) ៖</text>
  <text x="60" y="310" fill="#14532d" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• ប្រាក់ខែគោលប្រចាំសប្តាហ៍ ៖ <b>60 zeds</b></text>
  <text x="60" y="332" fill="#14532d" font-family="'Noto Sans Khmer', sans-serif" font-size="12">• បន្ថែម ៖ <b>0.05 zeds / មួយច្បាប់</b></text>
  <text x="60" y="358" fill="#16a34a" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5" font-weight="700">ចំណូល 74 zeds → (74 - 60) ÷ 0.05 = 280 ច្បាប់</text>

  <!-- Right Side: Comparison Graph -->
  <rect x="360" y="80" width="350" height="325" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="535" y="110" fill="#0d2b45" font-family="'Noto Sans Khmer', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ក្រាបចំណូលធៀបនឹងចំនួនច្បាប់លក់ (Graph C)</text>
  
  <!-- Graph axes -->
  <line x1="410" y1="340" x2="680" y2="340" stroke="#64748b" stroke-width="1.5"/>
  <line x1="410" y1="340" x2="410" y2="135" stroke="#64748b" stroke-width="1.5"/>
  <text x="680" y="360" fill="#64748b" font-family="'Noto Sans Khmer', sans-serif" font-size="11" text-anchor="end">ចំនួនច្បាប់</text>
  <text x="405" y="140" fill="#64748b" font-family="'Noto Sans Khmer', sans-serif" font-size="11" text-anchor="end">ប្រាក់ (zeds)</text>

  <!-- Axis ticks -->
  <text x="400" y="344" fill="#64748b" font-size="10" text-anchor="end">0</text>
  <text x="400" y="270" fill="#64748b" font-size="10" text-anchor="end">60</text>
  <text x="510" y="355" fill="#64748b" font-size="10" text-anchor="middle">240</text>
  <text x="580" y="355" fill="#64748b" font-size="10" text-anchor="middle">400</text>

  <!-- Zedland Daily line: starts at 60 (y=270), gentle slope up -->
  <line x1="410" y1="270" x2="670" y2="215" stroke="#16a34a" stroke-width="2.5"/>
  <text x="675" y="215" fill="#16a34a" font-family="'Noto Sans Khmer', sans-serif" font-size="11" font-weight="700">The Daily</text>

  <!-- Zedland Star line: starts at 0, slope up to 240, then steep slope up -->
  <polyline points="410,340 510,290 580,234 670,160" fill="none" stroke="#0284c7" stroke-width="2.5"/>
  <text x="675" y="160" fill="#0284c7" font-family="'Noto Sans Khmer', sans-serif" font-size="11" font-weight="700">The Star</text>

  <!-- Intersection point at 400 copies, 80 zeds -->
  <circle cx="580" cy="234" r="4.5" fill="#ea580c"/>
  <text x="580" y="222" fill="#ea580c" font-family="'Noto Sans Khmer', sans-serif" font-size="11" font-weight="700" text-anchor="middle">ចំណុចស្មើគ្នា (400 ច្បាប់)</text>
</svg>
