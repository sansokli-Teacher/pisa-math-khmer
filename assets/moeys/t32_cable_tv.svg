<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 430" width="100%" height="100%">
  <rect width="740" height="430" fill="#f8fafc" rx="12"/>
  
  <rect x="30" y="20" width="680" height="42" rx="8" fill="#0d2b45"/>
  <text x="370" y="47" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="15" font-weight="700" text-anchor="middle">ទិន្នន័យទូរទស្សន៍ និងបណ្តាញខ្សែកាបក្នុង ៥ ប្រទេស (Cable TV Data)</text>
  
  <!-- Table Container -->
  <rect x="30" y="80" width="680" height="235" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- Table Header -->
  <rect x="30" y="80" width="680" height="48" fill="#0284c7" rx="8"/>
  <rect x="30" y="115" width="680" height="13" fill="#0284c7"/>
  
  <g fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700">
    <text x="90" y="110" text-anchor="middle">ប្រទេស</text>
    <text x="210" y="103" text-anchor="middle">ចំនួនគ្រួសារមាន TV</text>
    <text x="210" y="120" text-anchor="middle">(លានគ្រួសារ)</text>
    <text x="380" y="103" text-anchor="middle">% គ្រួសារមាន TV</text>
    <text x="380" y="120" text-anchor="middle">ធៀបនឹងគ្រួសារសរុប</text>
    <text x="570" y="103" text-anchor="middle">% គ្រួសារភ្ជាប់ខ្សែកាប</text>
    <text x="570" y="120" text-anchor="middle">ធៀបនឹងគ្រួសារមាន TV</text>
  </g>
  
  <!-- Table Rows -->
  <g font-family="'Noto Sans Khmer', sans-serif" font-size="12.5">
    <!-- Japan -->
    <rect x="30" y="128" width="680" height="35" fill="#f8fafc"/>
    <text x="90" y="150" fill="#0f172a" font-weight="700" text-anchor="middle">ជប៉ុន</text>
    <text x="210" y="150" fill="#334155" text-anchor="middle">48.0 លាន</text>
    <text x="380" y="150" fill="#334155" text-anchor="middle">99.8%</text>
    <text x="570" y="150" fill="#334155" text-anchor="middle">51.4%</text>

    <!-- France -->
    <rect x="30" y="163" width="680" height="35" fill="#ffffff"/>
    <text x="90" y="185" fill="#0f172a" font-weight="700" text-anchor="middle">បារាំង</text>
    <text x="210" y="185" fill="#0284c7" font-weight="700" text-anchor="middle">24.5 លាន</text>
    <text x="380" y="185" fill="#334155" text-anchor="middle">97.0%</text>
    <text x="570" y="185" fill="#0284c7" font-weight="700" text-anchor="middle">15.4% (~3.8 លាន)</text>

    <!-- Belgium -->
    <rect x="30" y="198" width="680" height="35" fill="#f8fafc"/>
    <text x="90" y="220" fill="#0f172a" font-weight="700" text-anchor="middle">បែលហ្ស៊ិក</text>
    <text x="210" y="220" fill="#334155" text-anchor="middle">4.4 លាន</text>
    <text x="380" y="220" fill="#334155" text-anchor="middle">99.0%</text>
    <text x="570" y="220" fill="#334155" text-anchor="middle">91.7%</text>

    <!-- Switzerland -->
    <rect x="30" y="233" width="680" height="35" fill="#eff6ff"/>
    <text x="90" y="255" fill="#1e40af" font-weight="700" text-anchor="middle">ស្វីស</text>
    <text x="210" y="255" fill="#1e40af" font-weight="700" text-anchor="middle">2.8 លាន</text>
    <text x="380" y="255" fill="#1e40af" font-weight="700" text-anchor="middle">85.8% (សរុប ≈ 3.3 លាន)</text>
    <text x="570" y="255" fill="#1e40af" text-anchor="middle">98.0%</text>

    <!-- Norway -->
    <rect x="30" y="268" width="680" height="35" fill="#ffffff"/>
    <text x="90" y="290" fill="#0f172a" font-weight="700" text-anchor="middle">ន័រវែស</text>
    <text x="210" y="290" fill="#dc2626" font-weight="700" text-anchor="middle">2.0 លាន</text>
    <text x="380" y="290" fill="#334155" text-anchor="middle">97.2%</text>
    <text x="570" y="290" fill="#dc2626" font-weight="700" text-anchor="middle">42.7% (~0.85 លាន)</text>
  </g>
  
  <!-- Analytical Note Bottom -->
  <rect x="30" y="330" width="680" height="75" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="50" y="355" fill="#0f172a" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700">ការវិភាគស្ថិតិ (PISA Insights) ៖</text>
  <text x="50" y="375" fill="#334155" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5">• សំណួរទី ១ (ស្វីស) ៖ គ្រួសារសរុប = 2.8 លាន ÷ 0.858 ≈ <b>3.3 លានគ្រួសារ</b> (Option គ)</text>
  <text x="50" y="393" fill="#334155" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5">• សំណួរទី ២ (បារាំង vs ន័រវែស) ៖ បារាំងមានខ្សែកាប ~3.8 លាន ច្រើនជាងន័រវែស (~0.85 លាន) ទោះភាគរយន័រវែសខ្ពស់ជាង</text>
</svg>
