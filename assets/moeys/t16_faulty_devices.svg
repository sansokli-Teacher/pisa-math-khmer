<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/></filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#f1f5f9"/></linearGradient>
  </defs>
  <rect x="5" y="5" width="670" height="420" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="32" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">ទិន្នន័យឧបករណ៍ដែលខូច របស់ក្រុមហ៊ុន Electrix និង Tronics</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#64748b">ការប្រៀបធៀបបរិមាណផលិតផល និងអត្រាខូចជាមធ្យមប្រចាំថ្ងៃ</text>

  <!-- Table 1: Video Players -->
  <g transform="translate(30, 72)" filter="url(#sh)">
    <rect width="620" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="620" height="32" rx="8" fill="#e0e7ff"/>
    <rect y="24" width="620" height="8" fill="#e0e7ff"/>
    <text x="16" y="21" font-size="12.5" font-weight="bold" fill="#3730a3">📺 ឧបករណ៍ចាក់វីដេអូ (Video Players)</text>
    <text x="260" y="21" font-size="11.5" font-weight="bold" fill="#3730a3">ផលិតជាមធ្យម/ថ្ងៃ</text>
    <text x="460" y="21" font-size="11.5" font-weight="bold" fill="#3730a3">ភាគរយខូចជាមធ្យម/ថ្ងៃ</text>

    <!-- Electrix -->
    <line x1="16" y1="75" x2="604" y2="75" stroke="#f1f5f9" stroke-width="1.5"/>
    <text x="20" y="60" font-size="12" font-weight="bold" fill="#0284c7">ក្រុមហ៊ុន អេឡិចទ្រិក (Electrix)</text>
    <text x="280" y="60" font-size="12" font-weight="bold" fill="#0f172a">2 000</text>
    <text x="480" y="60" font-size="12" font-weight="bold" fill="#b91c1c">5%</text>

    <!-- Tronics -->
    <text x="20" y="105" font-size="12" font-weight="bold" fill="#059669">ក្រុមហ៊ុន ត្រូនីច (Tronics)</text>
    <text x="280" y="105" font-size="12" font-weight="bold" fill="#0f172a">7 000</text>
    <text x="480" y="105" font-size="12" font-weight="bold" fill="#b91c1c">4%</text>
  </g>

  <!-- Table 2: Audio Players -->
  <g transform="translate(30, 225)" filter="url(#sh)">
    <rect width="620" height="135" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect width="620" height="32" rx="8" fill="#e0f2fe"/>
    <rect y="24" width="620" height="8" fill="#e0f2fe"/>
    <text x="16" y="21" font-size="12.5" font-weight="bold" fill="#0369a1">📻 ឧបករណ៍ចាក់សំឡេង (Audio Players)</text>
    <text x="260" y="21" font-size="11.5" font-weight="bold" fill="#0369a1">ផលិតជាមធ្យម/ថ្ងៃ</text>
    <text x="460" y="21" font-size="11.5" font-weight="bold" fill="#0369a1">ភាគរយខូចជាមធ្យម/ថ្ងៃ</text>

    <!-- Electrix -->
    <line x1="16" y1="75" x2="604" y2="75" stroke="#f1f5f9" stroke-width="1.5"/>
    <text x="20" y="60" font-size="12" font-weight="bold" fill="#0284c7">ក្រុមហ៊ុន អេឡិចទ្រិក (Electrix)</text>
    <text x="280" y="60" font-size="12" font-weight="bold" fill="#0f172a">6 000</text>
    <text x="480" y="60" font-size="12" font-weight="bold" fill="#b91c1c">3%</text>

    <!-- Tronics -->
    <text x="20" y="105" font-size="12" font-weight="bold" fill="#059669">ក្រុមហ៊ុន ត្រូនីច (Tronics)</text>
    <text x="280" y="105" font-size="12" font-weight="bold" fill="#0f172a">1 000</text>
    <text x="480" y="105" font-size="12" font-weight="bold" fill="#b91c1c">2%</text>
  </g>

  <!-- Note -->
  <g transform="translate(30, 372)">
    <text x="310" y="20" text-anchor="middle" font-size="11.5" fill="#475569">ℹ ផលិតផលដែលខូចត្រូវបានដកចេញ និងបញ្ជូនទៅផ្នែកជួសជុលជារៀងរាល់ថ្ងៃ។</text>
  </g>
</svg>