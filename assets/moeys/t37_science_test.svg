<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <rect width="700" height="400" fill="#f8fafc" rx="12"/>
  
  <rect x="30" y="20" width="640" height="42" rx="8" fill="#0d2b45"/>
  <text x="350" y="47" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="15" font-weight="700" text-anchor="middle">កំណត់ត្រាពិន្ទុតេស្តវិទ្យាសាស្ត្ររបស់ ម៉ីលីង (Mei-Ling's Science Test)</text>
  
  <!-- Test Record Board -->
  <rect x="50" y="85" width="600" height="285" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  
  <!-- 5 Test Scores Visual Cards -->
  <g font-family="'Noto Sans Khmer', sans-serif">
    <!-- First 4 Tests Group -->
    <rect x="75" y="110" width="395" height="135" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="272" y="135" fill="#1e40af" font-size="13" font-weight="700" text-anchor="middle">សំណួរតេស្ត ៤ លើកដំបូង</text>
    
    <rect x="90" y="150" width="80" height="75" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="130" y="175" fill="#334155" font-size="11" text-anchor="middle">តេស្ត ១</text>
    <text x="130" y="208" fill="#0284c7" font-size="18" font-weight="700" text-anchor="middle">?</text>

    <rect x="180" y="150" width="80" height="75" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="220" y="175" fill="#334155" font-size="11" text-anchor="middle">តេស្ត ២</text>
    <text x="220" y="208" fill="#0284c7" font-size="18" font-weight="700" text-anchor="middle">?</text>

    <rect x="270" y="150" width="80" height="75" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="310" y="175" fill="#334155" font-size="11" text-anchor="middle">តេស្ត ៣</text>
    <text x="310" y="208" fill="#0284c7" font-size="18" font-weight="700" text-anchor="middle">?</text>

    <rect x="360" y="150" width="80" height="75" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="400" y="175" fill="#334155" font-size="11" text-anchor="middle">តេស្ត ៤</text>
    <text x="400" y="208" fill="#0284c7" font-size="18" font-weight="700" text-anchor="middle">?</text>

    <text x="272" y="238" fill="#1d4ed8" font-size="12" font-weight="700" text-anchor="middle">📊 ពិន្ទុមធ្យមនៃ ៤ តេស្តដំបូង = 60 ពិន្ទុ</text>

    <!-- Test 5 (Highlighted) -->
    <rect x="490" y="110" width="135" height="135" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="557" y="138" fill="#065f46" font-size="13" font-weight="700" text-anchor="middle">តេស្តលើកទី ៥</text>
    <text x="557" y="185" fill="#059669" font-size="32" font-weight="700" text-anchor="middle">80</text>
    <text x="557" y="215" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">ពិន្ទុតេស្តទី ៥</text>
  </g>
  
  <!-- Info Summary Box at Bottom -->
  <rect x="75" y="265" width="550" height="85" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="350" y="295" fill="#0f172a" font-family="'Noto Sans Khmer', sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    លក្ខខណ្ឌតេស្តវិទ្យាសាស្ត្រ ៖
  </text>
  <text x="350" y="325" fill="#475569" font-family="'Noto Sans Khmer', sans-serif" font-size="12.5" text-anchor="middle">
    • ពិន្ទុអតិបរមានៃតេស្តនីមួយៗគឺ 100 ពិន្ទុ  |  • សរុបទាំងអស់មាន 5 សំណួរតេស្ត
  </text>
</svg>