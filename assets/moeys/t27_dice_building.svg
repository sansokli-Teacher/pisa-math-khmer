<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="100%" height="100%">
  <rect width="700" height="420" fill="#f8fafc" rx="12"/>
  
  <!-- Header -->
  <rect x="30" y="25" width="640" height="42" rx="8" fill="#0d2b45"/>
  <text x="350" y="52" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="15" font-weight="700" text-anchor="middle">សំណង់ពីគ្រាប់ឡុកឡាក់ចំនួន ៧ គ្រាប់ (Dice Building)</text>
  
  <!-- Rule Card -->
  <rect x="40" y="85" width="230" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="155" y="115" fill="#0d2b45" font-family="'Noto Sans Khmer', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">វិធានគ្រាប់ឡុកឡាក់ស្តង់ដារ</text>
  
  <rect x="55" y="130" width="200" height="65" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="155" y="155" fill="#1e40af" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700" text-anchor="middle">ផលបូកមុខទល់គ្នាស្មើ 7 ៖</text>
  <text x="155" y="178" fill="#1e3a8a" font-family="'Noto Sans Khmer', sans-serif" font-size="12" text-anchor="middle">1 ↔ 6 | 2 ↔ 5 | 3 ↔ 4</text>
  
  <text x="65" y="220" fill="#334155" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5">• សំណង់មាន 7 គ្រាប់</text>
  <text x="65" y="245" fill="#334155" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5">• មើលពីលើឃើញតែ 5 គ្រាប់</text>
  <text x="65" y="270" fill="#334155" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5">• 2 គ្រាប់ត្រូវបាំងបាតក្រោម</text>
  
  <rect x="55" y="300" width="200" height="65" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="155" y="325" fill="#166534" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700" text-anchor="middle">សំណួរ ៖</text>
  <text x="155" y="348" fill="#14532d" font-family="'Noto Sans Khmer', sans-serif" font-size="11.5" text-anchor="middle">ផលបូកគ្រាប់ចុចខាងលើ = 17</text>

  <!-- Right side: Isometric 3D Illustration of Stacked Dice -->
  <rect x="290" y="85" width="380" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="115" fill="#0d2b45" font-family="'Noto Sans Khmer', sans-serif" font-size="14" font-weight="700" text-anchor="middle">ទិដ្ឋភាពសំណង់គ្រាប់ឡុកឡាក់</text>
  <text x="480" y="135" fill="#0284c7" font-family="'Noto Sans Khmer', sans-serif" font-size="12" text-anchor="middle">↓↓ ទិដ្ឋភាពមើលពីលើ (Top View) ↓↓</text>
  
  <!-- Dice 1 (Top Center) -->
  <g transform="translate(440, 150)">
    <polygon points="40,0 80,20 40,40 0,20" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <polygon points="0,20 40,40 40,80 0,60" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <polygon points="40,40 80,20 80,60 40,80" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
    <circle cx="40" cy="20" r="3" fill="#dc2626"/>
    <text x="40" y="24" font-size="8" text-anchor="middle" fill="#dc2626">•</text>
  </g>
  <!-- Base Dice row -->
  <g transform="translate(360, 200)">
    <polygon points="40,0 80,20 40,40 0,20" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <polygon points="0,20 40,40 40,80 0,60" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <polygon points="40,40 80,20 80,60 40,80" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
    <circle cx="30" cy="15" r="2.5" fill="#0f172a"/><circle cx="50" cy="25" r="2.5" fill="#0f172a"/>
  </g>
  <g transform="translate(440, 240)">
    <polygon points="40,0 80,20 40,40 0,20" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <polygon points="0,20 40,40 40,80 0,60" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <polygon points="40,40 80,20 80,60 40,80" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
    <circle cx="40" cy="20" r="2.5" fill="#0f172a"/><circle cx="25" cy="15" r="2.5" fill="#0f172a"/><circle cx="55" cy="25" r="2.5" fill="#0f172a"/>
  </g>
  <g transform="translate(520, 200)">
    <polygon points="40,0 80,20 40,40 0,20" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
    <polygon points="0,20 40,40 40,80 0,60" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
    <polygon points="40,40 80,20 80,60 40,80" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
    <circle cx="30" cy="15" r="2.5" fill="#0f172a"/><circle cx="50" cy="15" r="2.5" fill="#0f172a"/><circle cx="30" cy="25" r="2.5" fill="#0f172a"/><circle cx="50" cy="25" r="2.5" fill="#0f172a"/>
  </g>
  
  <text x="480" y="360" fill="#475569" font-family="'Noto Sans Khmer', sans-serif" font-size="12" text-anchor="middle">
    មុខខាងលើទាំង 5 ៖ ផលបូកចំណុចសរុប = 17
  </text>
</svg>
