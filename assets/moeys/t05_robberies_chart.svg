<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="100%" style="background:#ffffff; font-family:'Kantumruy Pro', 'Noto Sans Khmer', -apple-system, sans-serif;">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>

  <rect x="5" y="5" width="670" height="420" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="340" y="32" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#0f172a">ចំនួនករណីចោរកម្មប្រចាំឆ្នាំនៅទីក្រុង Zedland</text>
  <text x="340" y="52" text-anchor="middle" font-size="12" fill="#64748b">ក្រាបដែលអ្នករាយការណ៍ព័ត៌មានទូរទស្សន៍បានលើកយកមកបង្ហាញ</text>

  <!-- Chart Area Container -->
  <g transform="translate(50, 75)" filter="url(#sh)">
    <rect width="580" height="245" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    
    <!-- Y-axis lines and labels (500 to 520) -->
    <!-- 520 -->
    <line x1="65" y1="35" x2="540" y2="35" stroke="#e2e8f0" stroke-dasharray="3,3"/>
    <text x="55" y="39" text-anchor="end" font-size="11.5" font-weight="bold" fill="#475569">520</text>
    
    <!-- 515 -->
    <line x1="65" y1="75" x2="540" y2="75" stroke="#e2e8f0" stroke-dasharray="3,3"/>
    <text x="55" y="79" text-anchor="end" font-size="11.5" fill="#64748b">515</text>
    
    <!-- 510 -->
    <line x1="65" y1="115" x2="540" y2="115" stroke="#e2e8f0" stroke-dasharray="3,3"/>
    <text x="55" y="119" text-anchor="end" font-size="11.5" fill="#64748b">510</text>
    
    <!-- 505 -->
    <line x1="65" y1="155" x2="540" y2="155" stroke="#e2e8f0" stroke-dasharray="3,3"/>
    <text x="55" y="159" text-anchor="end" font-size="11.5" fill="#64748b">505</text>
    
    <!-- 500 Baseline -->
    <line x1="65" y1="195" x2="540" y2="195" stroke="#0f172a" stroke-width="1.8"/>
    <text x="55" y="199" text-anchor="end" font-size="11.5" font-weight="bold" fill="#b91c1c">500</text>
    <text x="20" y="115" font-size="11" fill="#64748b" transform="rotate(-90 20 115)" text-anchor="middle">ចំនួនចោរកម្ម</text>

    <!-- Bars -->
    <!-- 1998: ~508 -->
    <!-- Height from 500 to 508 is 8 * 8 = 64px. Y = 195 - 64 = 131 -->
    <rect x="160" y="131" width="75" height="64" rx="4" fill="#60a5fa" stroke="#2563eb" stroke-width="1.5"/>
    <text x="197" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">~508</text>
    <text x="197" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ឆ្នាំ 1998</text>

    <!-- 1999: ~516 -->
    <!-- Height from 500 to 516 is 16 * 8 = 128px. Y = 195 - 128 = 67 -->
    <rect x="350" y="67" width="75" height="128" rx="4" fill="#f87171" stroke="#dc2626" stroke-width="1.5"/>
    <text x="387" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">~516</text>
    <text x="387" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#0f172a">ឆ្នាំ 1999</text>
  </g>

  <!-- Quote Box at Bottom -->
  <g transform="translate(50, 335)" filter="url(#sh)">
    <rect width="580" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="18" y="26" font-size="12" font-weight="bold" fill="#0f172a">សម្តីរបស់អ្នករាយការណ៍ទូរទស្សន៍ ៖</text>
    <text x="18" y="48" font-size="12" fill="#b91c1c" font-style="italic">«ក្រាបនេះបង្ហាញថា មានការកើនឡើងយ៉ាងខ្លាំង នៃចំនួនចោរកម្មពីឆ្នាំ 1998 ដល់ឆ្នាំ 1999!»</text>
  </g>
</svg>