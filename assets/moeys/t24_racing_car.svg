<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sky24" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="60%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="sea24" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="740" height="450" fill="#f8fafc" rx="12"/>
  
  <!-- Sky background -->
  <rect x="25" y="25" width="690" height="300" rx="8" fill="url(#sky24)"/>
  <!-- Sea background -->
  <rect x="25" y="325" width="690" height="100" rx="8" fill="url(#sea24)"/>
  
  <!-- Title banner -->
  <rect x="40" y="35" width="300" height="36" rx="6" fill="#0d2b45" opacity="0.9"/>
  <text x="190" y="59" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="14" font-weight="700" text-anchor="middle">កប៉ាល់ប្រើប៉ោងខ្យល់ (NewWave)</text>

  <!-- Ship Hull -->
  <path d="M 80 325 L 120 375 L 290 375 L 320 325 Z" fill="#334155" stroke="#1e293b" stroke-width="2"/>
  <rect x="140" y="295" width="120" height="30" fill="#64748b"/>
  <rect x="170" y="275" width="60" height="20" fill="#94a3b8"/>
  <rect x="210" y="255" width="10" height="20" fill="#cbd5e1"/>
  
  <!-- Ship deck attachment point P -->
  <circle cx="310" cy="325" r="5" fill="#ea580c"/>
  <text x="310" y="345" fill="#ffffff" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="700" text-anchor="middle">ក្បាលកប៉ាល់</text>
  
  <!-- Kite / Paraglider in sky -->
  <g transform="translate(460, 90)">
    <path d="M 0 30 Q 50 -10 100 30 Q 50 15 0 30 Z" fill="#f97316" stroke="#c2410c" stroke-width="2"/>
    <line x1="0" y1="30" x2="50" y2="70" stroke="#f97316" stroke-width="1.5"/>
    <line x1="100" y1="30" x2="50" y2="70" stroke="#f97316" stroke-width="1.5"/>
    <circle cx="50" cy="70" r="4" fill="#c2410c"/>
  </g>
  
  <!-- Rope / Cable from ship to kite -->
  <line x1="310" y1="325" x2="510" y2="160" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="400" y="230" fill="#9a3412" font-family="'Noto Sans Khmer', sans-serif" font-size="13" font-weight="700" transform="rotate(-38 400 230)">ប្រវែងខ្សែពួរ ?</text>
  
  <!-- Geometric right triangle breakdown -->
  <!-- Vertical height line -->
  <line x1="510" y1="160" x2="510" y2="325" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Horizontal baseline -->
  <line x1="310" y1="325" x2="510" y2="325" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Right angle mark -->
  <rect x="495" y="310" width="15" height="15" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  
  <!-- Height label: 150m -->
  <text x="525" y="248" fill="#0369a1" font-family="'Noto Sans Khmer', sans-serif" font-size="14" font-weight="700">កម្ពស់ 150 m</text>
  
  <!-- Angle 45 degrees arc -->
  <path d="M 350 325 A 40 40 0 0 0 342 299" fill="none" stroke="#ea580c" stroke-width="2"/>
  <text x="365" y="315" fill="#ea580c" font-family="'Noto Sans Khmer', sans-serif" font-size="13" font-weight="700">45°</text>
  
  <!-- Bottom info banner -->
  <rect x="40" y="385" width="660" height="30" rx="6" fill="#0f172a" opacity="0.8"/>
  <text x="370" y="405" fill="#f8fafc" font-family="'Noto Sans Khmer', sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    កម្ពស់ 150 m | មុំទាញ 45° | ខ្សែពួរ = 150 ÷ sin(45°) = 150 × √2 ≈ 212 m
  </text>
</svg>
