<body>
  <div id="app">
    <noscript>កម្មវិធីនេះត្រូវការ JavaScript។ សូមបើក JavaScript ក្នុងកម្មវិធីរុករក (browser)។</noscript>
  </div>
  <!-- Plain scripts (no modules) so the page also works when opened straight
       from a folder or USB stick, without a web server. -->
  <!-- KaTeX draws the textbook tasks' mathematics and students' typed maths (MIT licence, katex/LICENSE) -->
  <script src="js/core.js?v=06aefeaa76"></script>
  <script src="js/widgets.js?v=e020d17a92"></script>

  <script src="js/calculator.js?v=257fedf43a"></script>
  <!-- QR codes (qrcode-generator, MIT licence, see NOTICE.md) and the comfort layer: settings, overview, shortcuts, sharing -->

  <!-- the book's own units: generated data, hand-written scoring, renderer -->
  <!-- the PISA tasks of the Grade 9 textbook (generated by the website build) -->
  <!-- MoEYS PISA sample items (38 topics) -->
  <!-- the seven OECD illustrative examples (chapter 8) -->
  <!-- the tutorial: how to answer on the screen -->
  <script src="js/data/catalog.js?v=d52dc6595f"></script>
  <script src="js/main.js?v=ed13d6c70a"></script>
  <script src="js/visits.js?v=96ec68e49a" data-site="cba" defer></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then((reg) => {
          console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
        }).catch((err) => {
          console.warn('[PWA] ServiceWorker registration failed:', err);
        });
      });
    }
  </script>
